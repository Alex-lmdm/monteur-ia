<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- PIÈGE N°1 : charger brand/fonts.css + brand/tokens.css DANS LE <head> DU MASTER.
         Sans ça, au render par couches les var(--brand-*) et les polices des sous-comps ne se
         résolvent pas → couleurs noires au lieu de l'accent, police système au lieu de la tienne.
         Ces deux fichiers sont GÉNÉRÉS par `npm run sync` depuis brand.config.json. -->
    <link rel="stylesheet" href="brand/fonts.css">
    <link rel="stylesheet" href="brand/tokens.css">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Jamais de couleur en dur ici : tools/build_overlay.py neutralise ce fond par
         substitution de `var(--brand-bg)` pour produire le calque alpha. */
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--brand-bg); }

      /* Zone d'attente de l'aperçu uniquement. Le master réel est généré depuis la vidéo
         du client par tools/build_master.py ; il conserve le visage en couleur. */
      .face-placeholder { position:absolute; top:920px; left:0; width:1080px; height:1000px;
        background:var(--brand-surface); color:var(--brand-text); display:flex;
        align-items:center; justify-content:center; flex-direction:column; gap:24px;
        font-family:var(--brand-font-body); }
      .face-placeholder svg { width:96px; height:96px; color:var(--brand-muted); }
      .face-placeholder p { font-size:32px; font-weight:700; }
      .face-placeholder span { font-size:24px; color:var(--brand-muted); }
    </style>
  </head>
  <body>
    <!-- Aperçu du style, sans vidéo ni voix client. La zone du bas est une attente explicite.
         tools/build_master.py génère le vrai master après dérush ; aucune mire de test
         n'est montrée au client. Les médias techniques restent disponibles dans assets/video. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">

      <!-- Fond de marque (seul aplat opaque autorisé, tout en bas de la pile). -->
      <div id="bgbase" class="clip" data-start="0" data-duration="8" data-track-index="0" style="position:absolute; inset:0; background:var(--brand-bg);"></div>

      <div id="demo-video-placeholder" class="face-placeholder clip" data-start="0" data-duration="8" data-track-index="10">
        <svg viewBox="0 0 96 96" fill="none" aria-hidden="true"><rect x="12" y="22" width="52" height="52" rx="14" stroke="currentColor" stroke-width="3"/><path d="M64 40l20-12v40L64 56" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>
        <p>Ta vidéo prend place ici</p><span>Ton visage reste en couleur</span>
      </div>

      <!-- CALQUE SECTION : host de la sous-comp. Chemin depuis la RACINE (jamais ../ : un chemin
           qui remonte casse le montage des scripts au render → timelines muettes). -->
      <div class="clip" data-composition-id="exemple-section" data-composition-src="compositions/exemple-section.html"
           data-start="0" data-duration="8" data-track-index="2" data-width="1080" data-height="920"
           style="position:absolute; left:0; top:0; width:1080px; height:920px; overflow:hidden;"></div>

      <!-- CALQUE SOUS-TITRES (par-dessus tout). Chemin depuis la RACINE. -->
      <div class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html"
           data-start="0" data-duration="8" data-track-index="14" data-width="1080" data-height="1920"
           style="position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden;"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
