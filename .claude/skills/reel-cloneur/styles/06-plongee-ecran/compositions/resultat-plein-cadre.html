<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE 06 · PLONGÉE ÉCRAN · pièce « résultat plein cadre »                     ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
    CE QUE C'EST : le résultat produit par l'outil, plein cadre, sans le portable : un mur
      d'images (grille de 2 ou 3 colonnes qui dérive doucement) ou une image seule nette sur son
      propre fond flou. Coupe sèche d'un plan à l'autre.
    TAILLE : 1080 x 1920, section `full`.
    QUAND : la phrase qui montre ce qui sort de l'outil (« voilà ce que ça donne »), 1 à 2,5 s.
    À REMPLACER :
      1. L'id `resultat-plein-cadre` PARTOUT par l'id de la section ; data-duration.
      2. Chaque .tuile (ou .vide) par <img src="assets/images/…" alt=""> : images du résultat
         (fichiers du client, ou captures de pages publiques, source notée). Image seule : pour
         une image de moins de 900 px de large, préférer la grille (pas d'agrandissement flou).
      3. PLANS : t (début du plan), de / a (zoom lent), y0 / y1 (dérive verticale).
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>

    #resultat-plein-cadre { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; font-family:var(--brand-font-body); }
    #resultat-plein-cadre * { box-sizing:border-box; }
    #resultat-plein-cadre .scene { position:absolute; inset:0; overflow:hidden; background:var(--brand-muted); }
    #resultat-plein-cadre .plan { position:absolute; inset:0; opacity:0; overflow:hidden; }
    #resultat-plein-cadre .plan .flou { position:absolute; inset:-80px; width:calc(100% + 160px); height:calc(100% + 160px); object-fit:cover;
      filter:blur(40px) brightness(0.6); }
    #resultat-plein-cadre .plan .net { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); }
    #resultat-plein-cadre .plan .mur { position:absolute; left:-60px; right:-60px; top:-120px; display:grid; gap:18px; }
    #resultat-plein-cadre .plan .mur img { width:100%; aspect-ratio:1 / 1; object-fit:cover; border-radius:18px; display:block; }


    /* Emplacements vides : à remplacer par tes images (voir l'en-tête). */
    #resultat-plein-cadre .vide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
      font-family:var(--brand-font-body); font-weight:700; font-size:40px; line-height:1.3; padding:40px;
      color:var(--brand-text); background:color-mix(in srgb, var(--brand-surface) 85%, var(--brand-bg));
      border:4px dashed color-mix(in srgb, var(--brand-text) 55%, transparent); }
    #resultat-plein-cadre .tuile { position:relative; aspect-ratio:1 / 1; border-radius:18px; overflow:hidden; }
    #resultat-plein-cadre .tuile .vide { font-size:34px; }
    #resultat-plein-cadre .logo-vide { width:52px; height:52px; border-radius:14px; margin:0 0 26px 14px; background:var(--brand-surface); }
    #resultat-plein-cadre .marque .logo-vide { width:150px; height:150px; border-radius:34px; margin:0; background:var(--brand-text);
      border:6px dashed var(--brand-surface); }
  </style>
</head>
<body>
  <div id="resultat-plein-cadre" data-composition-id="resultat-plein-cadre" data-start="0" data-duration="2.5" data-fps="30" data-width="1080" data-height="1920">
    <div id="resultat-plein-cadre-scene" class="scene clip" data-start="0" data-duration="2.5" data-track-index="0">
      <div class="plan plan-0"><div class="mur bouge" data-layout-allow-overflow style="grid-template-columns:repeat(3, 1fr)"><div class="tuile"><div class="vide">Image 1</div></div><div class="tuile"><div class="vide">Image 2</div></div><div class="tuile"><div class="vide">Image 3</div></div><div class="tuile"><div class="vide">Image 4</div></div><div class="tuile"><div class="vide">Image 5</div></div><div class="tuile"><div class="vide">Image 6</div></div><div class="tuile"><div class="vide">Image 7</div></div><div class="tuile"><div class="vide">Image 8</div></div><div class="tuile"><div class="vide">Image 9</div></div><div class="tuile"><div class="vide">Image 10</div></div><div class="tuile"><div class="vide">Image 11</div></div><div class="tuile"><div class="vide">Image 12</div></div><div class="tuile"><div class="vide">Image 13</div></div><div class="tuile"><div class="vide">Image 14</div></div><div class="tuile"><div class="vide">Image 15</div></div></div></div>
      <div class="plan plan-1"><div class="mur bouge" data-layout-allow-overflow style="grid-template-columns:repeat(2, 1fr)"><div class="tuile"><div class="vide">Image 1</div></div><div class="tuile"><div class="vide">Image 2</div></div><div class="tuile"><div class="vide">Image 3</div></div><div class="tuile"><div class="vide">Image 4</div></div><div class="tuile"><div class="vide">Image 5</div></div><div class="tuile"><div class="vide">Image 6</div></div><div class="tuile"><div class="vide">Image 7</div></div><div class="tuile"><div class="vide">Image 8</div></div></div></div>
    </div>
  </div>
  <script>

  (function () {
    var ID = 'resultat-plein-cadre';
    var S = '#' + ID + ' ';
    var root = document.getElementById(ID);
    // ===== RÉGLAGES DE LA SECTION (à remplacer) =====
    var DUREE = 2.5;
    var PLANS = [{"t": 0, "de": 1.0, "a": 1.04, "y0": 60, "y1": -40}, {"t": 1.3, "de": 1.0, "a": 1.05, "y0": 40, "y1": -40}];
    var SAISIES = [];
    // ===== FIN DES RÉGLAGES =====
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    // Saisies : chaque lettre devient un <span class="c">, révélé lettre à lettre (sans callback,
    // donc juste dans l'aperçu comme au rendu).
    SAISIES.forEach(function (s) {
      var el = root.querySelector(s.sel);
      if (!el) { return; }
      var txt = el.getAttribute('data-texte') || '';
      el.textContent = '';
      for (var i = 0; i < txt.length; i++) {
        var c = document.createElement('span'); c.className = 'c'; c.textContent = txt[i]; el.appendChild(c);
      }
      gsap.set(S + s.sel + ' .c', { opacity: 0 });
      if (s.placeholder) { tl.set(S + s.placeholder, { opacity: 0 }, s.t0); }
      tl.to(S + s.sel + ' .c', { opacity: 1, duration: 0.01, stagger: (s.t1 - s.t0) / Math.max(1, txt.length) }, s.t0);
    });

    // Plans plein cadre : coupe sèche de l'un à l'autre ; chacun avance doucement (zoom lent).
    PLANS.forEach(function (p, i) {
      var fin = i + 1 < PLANS.length ? PLANS[i + 1].t : DUREE;
      if (p.t <= 0) { gsap.set(S + '.plan-' + i, { opacity: 1 }); }
      else { tl.set(S + '.plan', { opacity: 0 }, p.t); tl.set(S + '.plan-' + i, { opacity: 1 }, p.t); }
      tl.fromTo(S + '.plan-' + i + ' .bouge', { scale: p.de || 1, y: p.y0 || 0 },
        { scale: p.a || 1.06, y: p.y1 || 0, duration: fin - p.t, ease: 'none' }, p.t);
    });

    window.__timelines[ID] = tl;
  })();

  </script>
</body>
</html>
