<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°10 « AVIS PRODUIT » · PIÈCE « PAGE PRODUIT » (fond de la personne     ║
    ║ détourée)                                                                    ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
    Ce que c'est : la page publique du produit, plein cadre, qui saute d'un endroit à l'autre
    (défilement sec), un passage surligné, une flèche rouge, puis un zoom brusque. La personne
    détourée passe DEVANT (calque du master) : seuls le haut de la page et ses côtés se voient.
    Taille : section « detoure » 1080×1920 (tools/sections.py), fond OPAQUE (c'est le décor).
    Quand : une fois par vidéo, 5 à 7 s d'un bloc, sur ce que fait le produit (sa promesse,
    ce qu'il récupère, ce qu'il produit). Sous-titres gardés (y = 1100, sur le buste).
    Ce qui se voit : la bande du haut (0 à ~450 px) et les côtés ; tout texte qui doit se lire
    va donc en haut (titre de la page vers 150 à 450 px à chaque arrêt).
    À remplacer :
      1. l'id « avis10-page-produit » PARTOUT par l'id de la section ;
      2. data-duration (racine et panneau) et DUREE = durée de la section ;
      3. EMPLACEMENT .a10-page-exemple (dessin neutre) → la capture pleine page de la page
         publique du produit, faite par le monteur sans compte (1080 px de large, voir
         style.md, « Données à demander ») :
           <img class="a10-capture" src="assets/images/page-produit.jpg" alt="">
         puis les surlignages en <div class="a10-surligne a10-s0" style="left:…px; top:…px;
         width:…px; height:…px;"></div> dans .a10-vue, en pixels de la capture ;
      4. ARRETS : où la page s'arrête [instant, y de la capture en haut de l'écran], un arrêt
         par idée dite (2 ou 3), calés sur derush/<cut>_words.json ;
      5. FLECHE : instant d'arrivée, instant de départ (le saut suivant) ; son tracé (attribut d
         du <path>, en pixels de l'écran) pointe le passage qui compte ;
      6. ZOOM : [instant, échelle 1,25 à 1,4, origine x, origine y] sur le dernier arrêt, ou
         null pour s'en passer.
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #avis10-page-produit { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; }
    #avis10-page-produit .a10-ecran { position:absolute; inset:0; overflow:hidden; background:var(--brand-surface); }
    #avis10-page-produit .a10-cadre { position:absolute; inset:0; }
    #avis10-page-produit .a10-vue { position:absolute; left:0; top:0; width:1080px; }
    #avis10-page-produit .a10-capture { display:block; width:1080px; height:auto; }
    #avis10-page-produit .a10-surligne { position:absolute; background:var(--brand-accent); mix-blend-mode:multiply;
      transform-origin:0 50%; border-radius:4px; }
    #avis10-page-produit .a10-fleche { position:absolute; left:0; top:0; width:1080px; height:1920px; opacity:0; overflow:visible; }
    #avis10-page-produit .a10-fleche path { fill:none; stroke:var(--brand-negative); stroke-width:10; stroke-linecap:round;
      stroke-linejoin:round; stroke-dasharray:1; }
    /* EMPLACEMENT : page dessinée, neutre, à remplacer par la capture de la vraie page. */
    #avis10-page-produit .a10-page-exemple { position:relative; width:1080px; height:3200px; font-family:var(--brand-font-body);
      color:var(--brand-text); background:var(--brand-surface); }
    #avis10-page-produit .a10-pe-barre { position:absolute; left:0; right:0; top:0; height:120px; display:flex; align-items:center; gap:20px;
      padding:0 48px; border-bottom:2px solid color-mix(in srgb, var(--brand-text) 10%, transparent); font-size:34px; font-weight:700; }
    #avis10-page-produit .a10-pe-logo { width:60px; height:60px; border-radius:16px; background:var(--brand-accent); }
    #avis10-page-produit .a10-pe-titre { position:absolute; left:48px; right:48px; font-size:66px; line-height:1.08; font-weight:900; letter-spacing:-1.5px; }
    #avis10-page-produit .a10-pe-texte { position:absolute; left:48px; right:48px; font-size:38px; line-height:1.35; color:var(--brand-muted); }
    #avis10-page-produit .a10-pe-image { position:absolute; left:48px; right:48px; border-radius:28px;
      background:color-mix(in srgb, var(--brand-text) 8%, var(--brand-surface)); display:flex; align-items:center; justify-content:center;
      font-size:34px; color:var(--brand-muted); }
  </style>
</head>
<body>
  <div id="avis10-page-produit" data-composition-id="avis10-page-produit" data-start="0" data-duration="5.4" data-fps="30" data-width="1080" data-height="1920">
    <div id="avis10-page-produit-panneau" class="clip" data-start="0" data-duration="5.4" data-track-index="0">
      <div class="a10-ecran">
        <div class="a10-cadre">
          <div class="a10-vue" data-layout-allow-overflow data-layout-allow-occlusion>
            <!-- EMPLACEMENT : remplacer tout ce bloc par <img class="a10-capture" …> (voir l'en-tête). -->
            <div class="a10-page-exemple">
              <div class="a10-pe-barre"><span class="a10-pe-logo"></span>Nom du produit</div>
              <div class="a10-pe-titre" style="top:200px;">Ce que fait le produit, en une phrase</div>
              <div class="a10-pe-texte" style="top:400px;">Une phrase de la page, recopiée telle quelle, avec le passage qui compte.</div>
              <div class="a10-pe-image" style="top:560px; height:560px;">image de la page</div>
              <div class="a10-pe-titre" style="top:1260px;">Deuxième partie de la page</div>
              <div class="a10-pe-texte" style="top:1460px;">Ce que le produit récupère ou fabrique, dit par la page.</div>
              <div class="a10-pe-image" style="top:1620px; height:620px;">exemples montrés par la page</div>
            </div>
            <div class="a10-surligne a10-s0" style="left:44px; top:398px; width:620px; height:50px;"></div>
          </div>
        </div>
        <svg class="a10-fleche a10-f0" viewBox="0 0 1080 1920" aria-hidden="true"><path d="M940,690 Q869,526 700,468 M745,460 L700,468 L731,502" pathLength="1"/></svg>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var ID = 'avis10-page-produit';
      var DUREE = 5.4;
      var ARRETS = [[0, 0], [1.8, 1100], [2.8, 1480]];   // [instant, y de la page en haut de l'écran]
      var SURLIGNES = [1.05];                            // instant de chaque .a10-sN
      var FLECHE = [1.2, 1.8];                           // arrivée, départ (ou null)
      var ZOOM = [4.0, 1.32, 540, 420];                  // instant, échelle, origine x, origine y (ou null)
      var scope = '#' + ID + ' ';
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      for (var i = 0; i < ARRETS.length; i++) tl.set(scope + '.a10-vue', { y: -ARRETS[i][1] }, ARRETS[i][0]);
      for (var j = 0; j < SURLIGNES.length; j++) {
        tl.fromTo(scope + '.a10-s' + j, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: 'power2.out' }, SURLIGNES[j]);
      }
      if (FLECHE) {
        tl.fromTo(scope + '.a10-f0', { opacity: 0 }, { opacity: 1, duration: 0.01 }, FLECHE[0]);
        tl.fromTo(scope + '.a10-f0 path', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.22, ease: 'power1.out' }, FLECHE[0]);
        tl.set(scope + '.a10-f0', { opacity: 0 }, FLECHE[1]);
      }
      if (ZOOM) tl.set(scope + '.a10-cadre', { scale: ZOOM[1], transformOrigin: ZOOM[2] + 'px ' + ZOOM[3] + 'px' }, ZOOM[0]);
      tl.set(scope + '.a10-vue', { opacity: 1 }, DUREE - 0.01);
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
