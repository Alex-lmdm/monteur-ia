<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°10 « AVIS PRODUIT » · PIÈCE « LOGO DE FIN »                           ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
    Ce que c'est : le logo du produit, en clair, en haut de l'image, qui arrive pendant l'appel
    à l'action et reste jusqu'à la fin, sur la vidéo filmée.
    Taille : section « decor » 1080×1920, fond TRANSPARENT ; logo de 520 px de large au plus,
    en haut vers 236 px, centré.
    Quand : la dernière section (appel à l'action), une seule fois par vidéo. Sous-titres gardés.
    À remplacer :
      1. l'id « avis10-logo-fin » PARTOUT par l'id de la section ;
      2. data-duration (racine et panneau) et DUREE = durée de la section ;
      3. EMPLACEMENT .a10-logo-texte : le vrai logo, <img class="a10-logo-fin" src="…" alt="…">
         (skill thesvg, variante claire « dark » ou « wordmarkDark » sur une vidéo ; absent de
         theSVG : l'en-tête de la page publique capturé net, fond retiré) ; sans logo trouvé, le
         nom du produit en texte, comme ici ;
      4. ARRIVEE : l'instant où la voix nomme le produit ou l'action (derush/<cut>_words.json).
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #avis10-logo-fin { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; }
    #avis10-logo-fin .a10-logo-fin { position:absolute; left:50%; top:236px; width:520px; margin-left:-260px; opacity:0;
      filter:drop-shadow(0 2px 14px color-mix(in srgb, var(--brand-text) 55%, transparent)); }
    #avis10-logo-fin .a10-logo-texte { position:absolute; left:var(--brand-safe-x); right:var(--brand-safe-x); top:236px; opacity:0;
      text-align:center; color:var(--brand-surface); font-family:var(--brand-font-body); font-size:76px; font-weight:700;
      letter-spacing:-1px; text-shadow:0 2px 14px color-mix(in srgb, var(--brand-text) 55%, transparent); }
  </style>
</head>
<body>
  <div id="avis10-logo-fin" data-composition-id="avis10-logo-fin" data-start="0" data-duration="7" data-fps="30" data-width="1080" data-height="1920">
    <div id="avis10-logo-fin-panneau" class="clip" data-start="0" data-duration="7" data-track-index="0">
      <!-- EMPLACEMENT : remplacer par <img class="a10-logo-fin" src="assets/images/logo-produit.png" alt="…">. -->
      <div class="a10-logo-texte">Nom du produit</div>
    </div>
  </div>
  <script>
    (function () {
      var ID = 'avis10-logo-fin';
      var DUREE = 7;
      var ARRIVEE = 1.1;
      var scope = '#' + ID + ' ';
      var cible = document.querySelector(scope + '.a10-logo-fin') ? '.a10-logo-fin' : '.a10-logo-texte';
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(scope + cible, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'expo.out' }, ARRIVEE);
      tl.set(scope + cible, { opacity: 1 }, DUREE - 0.01);
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
