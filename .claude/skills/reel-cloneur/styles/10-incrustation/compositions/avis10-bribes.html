<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°10 « INCRUSTATION » · PIÈCE « BRIBES SURLIGNÉES »                     ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
    Ce que c'est : trois morceaux de texte (façon captures blanches) qui arrivent l'un après
    l'autre autour de la tête, un mot surligné dans chacun. Ils montrent des preuves écrites :
    des phrases de la page du produit, des messages reçus, des extraits du problème.
    Taille : section « decor » 1080×1920, fond TRANSPARENT ; bribes de 680 px de large, en
    haut (150 à 550 px) et sur le buste (vers 1250 px), jamais sur les yeux ni la bouche.
    Quand : une fois par vidéo, 3 à 5 s, sur une phrase qui énumère ou qui pose le problème.
    Sous-titres gardés (y = 1100, entre les bribes).
    ⛔ Que du texte réel : une phrase de la page publique, un message que le client fournit.
    À remplacer :
      1. l'id « avis10-bribes » PARTOUT par l'id de la section ;
      2. data-duration (racine et panneau) et DUREE = durée de la section ;
      3. le texte de chaque .a10-bribe (2 à 3 lignes), le mot surligné dans .a10-cle ; ou, pour
         une capture découpée, remplacer le contenu par <img src="assets/images/bribe-1.png">
         (680 px de large) et poser le surlignage en <div> positionnée à la main par-dessus
         (fond var(--brand-accent), mix-blend-mode multiply, animée en scaleX) ;
      4. left / top des .a10-bN : en haut et sur le buste, autour du visage ;
      5. TEMPS : l'instant de chaque bribe, une par idée dite (derush/<cut>_words.json).
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #avis10-bribes { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; }
    #avis10-bribes .a10-bribe { position:absolute; width:680px; padding:24px 30px; border-radius:22px; opacity:0;
      background:var(--brand-surface); color:var(--brand-text); font-family:var(--brand-font-body);
      font-size:36px; line-height:1.35; transform-origin:50% 50%;
      box-shadow:0 10px 26px color-mix(in srgb, var(--brand-text) 25%, transparent); }
    /* Le surlignage est un fond qui se déroule de gauche à droite (marche aussi sur deux lignes). */
    #avis10-bribes .a10-cle { background-image:linear-gradient(var(--brand-accent), var(--brand-accent)); background-repeat:no-repeat;
      background-size:0% 100%; padding:0 4px; border-radius:4px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
    #avis10-bribes .a10-b1 { left:60px; top:150px; }
    #avis10-bribes .a10-b2 { left:340px; top:340px; }
    #avis10-bribes .a10-b3 { left:200px; top:1250px; }
  </style>
</head>
<body>
  <div id="avis10-bribes" data-composition-id="avis10-bribes" data-start="0" data-duration="4" data-fps="30" data-width="1080" data-height="1920">
    <div id="avis10-bribes-panneau" class="clip" data-start="0" data-duration="4" data-track-index="0">
      <div class="a10-bribe a10-b1">Première phrase réelle, avec <span class="a10-cle a10-s1">le mot clé</span> surligné.</div>
      <div class="a10-bribe a10-b2">Deuxième phrase réelle, <span class="a10-cle a10-s2">une autre preuve</span> écrite.</div>
      <div class="a10-bribe a10-b3">Troisième phrase réelle, prise sur <span class="a10-cle a10-s3">la page</span> du produit.</div>
    </div>
  </div>
  <script>
    (function () {
      var ID = 'avis10-bribes';
      var DUREE = 4;
      var TEMPS = [0.45, 1.1, 2.4];   // une bribe par idée dite
      var scope = '#' + ID + ' ';
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      for (var i = 0; i < TEMPS.length; i++) {
        tl.fromTo(scope + '.a10-b' + (i + 1), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'back.out(2)' }, TEMPS[i]);
        tl.fromTo(scope + '.a10-s' + (i + 1), { backgroundSize: '0% 100%' }, { backgroundSize: '100% 100%', duration: 0.25, ease: 'power2.out' }, TEMPS[i] + 0.2);
      }
      tl.set(scope + '.a10-b' + TEMPS.length, { opacity: 1 }, DUREE - 0.01);
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
