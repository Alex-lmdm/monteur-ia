<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    KIT N°09 « COLLAGE » · PIÈCE : RETOUR AU VISAGE (section DETOURE, 1080x1920, 2 s d'exemple)
    Ce que c'est : le fond du retour au visage, le collage d'avant figé à sa dernière image. Le moteur
    pose la personne détourée DEVANT (elle monte du bas, puis la vidéo filmée revient en fondu) : rien
    d'autre à animer ici.
    Quand : 2 fois au plus par vidéo, juste après une section collage, 1 à 5 s.
    Dans tools/sections.py :
      ("sN-retour", "detoure", [prises], {"entree": "monte", "visageRevient": 0.9}),
      visageRevient = 0,9 s, ou 0,4 s avant la fin si la section dure moins de 1,3 s.
    Le fond (une commande, depuis le Reel, collage d'avant = compositions/<collage>.html) :
      mkdir ../probe && cp compositions/<collage>.html ../probe/index.html && ln -s "$PWD/assets" ../probe/assets && ln -s "$PWD/brand" ../probe/brand
      npx hyperframes snapshot ../probe --at <durée du collage − 0,02> --describe false --no-end -o work/fond-<id> && rm -rf ../probe
      cp work/fond-<id>/frame-00-*.png assets/images/<id>-fond.png
    À remplacer : FOND (le chemin de l'image) ; data-duration du calque et de la racine = durée de la section.
    Renommer la pièce = renommer l'id PARTOUT (racine, data-composition-id, calque, constante ID du script).
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #kit09-retour { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; background:var(--brand-bg); }
    #kit09-retour .calque { position:absolute; inset:0; }
    #kit09-retour .fond { position:absolute; inset:0; width:1080px; height:1920px; object-fit:cover; }
  </style>
</head>
<body>
  <div id="kit09-retour" data-composition-id="kit09-retour" data-start="0" data-duration="2.0" data-fps="30" data-width="1080" data-height="1920">
    <div id="kit09-retour-calque" class="clip calque" data-start="0" data-duration="2.0" data-track-index="0">
      <!-- FOND : le collage d'avant à sa dernière image -->
      <img class="fond" src="assets/images/s3-retour-fond.png" alt="">
    </div>
  </div>
  <script>
    (function () {
      var ID = 'kit09-retour';
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 2.0);
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
