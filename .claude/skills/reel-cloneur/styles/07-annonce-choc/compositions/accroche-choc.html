<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°07 « ANNONCE CHOC » · PIÈCE 1 : L'ACCROCHE CHOC                        ║
    ╠══════════════════════════════════════════════════════════════════════════════╣
    ║ Ce que c'est : le titre géant de l'accroche, posé sur la poitrine, qui redit   ║
    ║ la première phrase en 2 ou 3 groupes de lignes empilées (ligne d'appel en      ║
    ║ dégradé d'accent, grosses lignes blanches, un mot manuscrit qui chevauche),    ║
    ║ puis un flash chaud qui coupe vers la suite.                                   ║
    ║ Taille : section plein cadre 1080×1920, fond TRANSPARENT, format « decor »     ║
    ║ (la vidéo filmée reste entière dessous). Bloc titre : ~700 px de large,        ║
    ║ centré, de y≈1030 à y≈1300 (sur la poitrine, sous le menton).                 ║
    ║ Quand l'utiliser : la 1re section du Reel, sur la 1re phrase seulement         ║
    ║ (2 à 4 s). Une fois par vidéo. Sous-titres coupés sur cette section :          ║
    ║ montage_captions.py --sans <id de la section>.                                 ║
    ║                                                                                ║
    ║ À REMPLACER :                                                                  ║
    ║  1. L'id « accroche-choc » (3 endroits : id et data-composition-id de la       ║
    ║     racine, constante ID du script) par l'id de la section (tools/sections.py).║
    ║  2. data-duration de la racine et du panneau = durée de la section             ║
    ║     (derush/<vidéo>_cuts.json, jamais Whisper).                                ║
    ║  3. Les groupes : un <div class="groupe"> par plan de titre, data-debut =      ║
    ║     l'instant (s, depuis le début de la section) où il remplace le précédent.  ║
    ║     Chaque mot est un <span data-layout-allow-occlusion data-layout-allow-overflow data-mot="t"> : t = l'instant où il est DIT        ║
    ║     (derush/<vidéo>_words.json, moins le début de la section).                 ║
    ║  4. Les textes : ceux que la voix dit, en capitales (le mot manuscrit en       ║
    ║     minuscules). Jamais un chiffre que la vidéo ne dit pas.                    ║
    ║  5. font-size de chaque ligne (style="font-size:…px") : une ligne blanche      ║
    ║     vise ~680 px de large (150 px au plus) ; une ligne d'appel, environ 0,7    ║
    ║     fois la ligne blanche qui la suit. Mesure : PIL, ArchivoBlack-400.ttf.     ║
    ║                                                                                ║
    ║ Genres de ligne : .appel (dégradé d'accent) · .blanc (blanc, dégradé vers le   ║
    ║ gris en bas) · .blanc.penche (italique simulé) · .script (mot manuscrit,       ║
    ║ accent lumineux) · .script.chaud (mot manuscrit dans la couleur chaude).       ║
    ║ Polices : var(--brand-font-display) pour les capitales ; le mot manuscrit      ║
    ║ utilise la police d'accent du style (Mr Dafoe, livrée, --brand-font-accent). ║
    ║ Couleurs : uniquement var(--brand-*) (le flash = --brand-surface, la couleur   ║
    ║ chaude du style).                                                              ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    
    /* Tout est scopé sous l'id de la racine (= id de la section) : au rendu, toutes les sections
       partagent un seul document. */
    #accroche-choc { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      background:transparent; }
    #accroche-choc * { box-sizing:border-box; }
    #accroche-choc .panneau { position:absolute; inset:0; background:transparent; }
    /* Bloc titre : centré, haut à 1030 px (sur la poitrine). */
    #accroche-choc .groupe { position:absolute; left:0; right:0; top:1030px; opacity:0;
      display:flex; flex-direction:column; align-items:center; }
    #accroche-choc .ligne { display:block; white-space:nowrap; text-align:center; line-height:.98;
      font-family:var(--brand-font-display); text-transform:uppercase; letter-spacing:-.5px;
      filter: drop-shadow(0 8px 16px color-mix(in srgb, var(--brand-bg) 55%, transparent)); }
    #accroche-choc .ligne span { display:inline-block; transform-origin:50% 60%; }
    /* Gros blanc : blanc franc en haut, gris clair en bas (comme un métal). */
    #accroche-choc .blanc span { color:transparent; -webkit-background-clip:text; background-clip:text;
      background-image:linear-gradient(180deg, var(--brand-text) 0%, var(--brand-text) 45%,
        color-mix(in srgb, var(--brand-text) 72%, var(--brand-bg)) 100%); }
    #accroche-choc .blanc.penche { transform:skewX(-11deg); }
    /* Ligne d'appel : dégradé de l'accent, du clair au profond. */
    #accroche-choc .appel span { color:transparent; -webkit-background-clip:text; background-clip:text;
      background-image:linear-gradient(180deg, color-mix(in srgb, var(--brand-accent) 62%, var(--brand-text)) 0%,
        var(--brand-accent) 55%, color-mix(in srgb, var(--brand-accent) 82%, var(--brand-bg)) 100%); }
    /* Mot manuscrit : chevauche les lignes voisines, penché, lumineux. */
    #accroche-choc .script { font-family:var(--brand-font-accent); text-transform:none;
      letter-spacing:0; line-height:.8; margin:-26px 0 -22px; position:relative; z-index:2;
      transform:rotate(-7deg); }
    #accroche-choc .script span { color:transparent; -webkit-background-clip:text; background-clip:text;
      padding:0 .12em; /* la police manuscrite déborde à droite : la marge garde le dégradé entier */
      background-image:linear-gradient(180deg, color-mix(in srgb, var(--brand-accent) 55%, var(--brand-text)) 0%,
        var(--brand-accent) 60%, color-mix(in srgb, var(--brand-accent) 80%, var(--brand-bg)) 100%);
      filter: drop-shadow(0 0 14px color-mix(in srgb, var(--brand-accent) 75%, transparent)); }
    #accroche-choc .script.chaud span { background-image:linear-gradient(180deg,
        color-mix(in srgb, var(--brand-surface) 55%, var(--brand-text)) 0%, var(--brand-surface) 70%);
      filter: drop-shadow(0 0 14px color-mix(in srgb, var(--brand-surface) 70%, transparent)); }
    /* Flash chaud de fin d'accroche : voile coloré + flou de ce qu'il y a dessous. */
    #accroche-choc .flash { position:absolute; inset:0; opacity:0; pointer-events:none;
      background:linear-gradient(170deg, color-mix(in srgb, var(--brand-surface) 72%, var(--brand-negative)) 0%,
        var(--brand-surface) 45%, color-mix(in srgb, var(--brand-surface) 78%, var(--brand-text)) 100%);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  </style>
</head>
<body>
  <!-- data-duration = durée de la section (ici un exemple de 3,4 s). -->
  <div id="accroche-choc" data-composition-id="accroche-choc" data-start="0"
       data-duration="3.4" data-fps="30" data-width="1080" data-height="1920">
    <div id="accroche-choc-panneau" class="panneau clip" data-start="0" data-duration="3.4" data-track-index="0">

      <!-- Flash chaud (sous le titre, qui reste lisible dessus) : monte sur les 0,15 dernières secondes de la section ; la section suivante
           le fait redescendre (bloc « flash de sortie » de la pièce tuiles-outils). -->
      <div class="flash"></div>

      <!-- GROUPE 1 : ligne d'appel + grosse ligne blanche. TEXTE D'EXEMPLE À REMPLACER. -->
      <div class="groupe" data-debut="0">
        <div class="ligne appel" style="font-size:96px"><span data-layout-allow-occlusion data-layout-allow-overflow data-mot="0.05">DEPUIS</span> <span data-layout-allow-occlusion data-layout-allow-overflow data-mot="0.30">CE</span> <span data-layout-allow-occlusion data-layout-allow-overflow data-mot="0.42">MATIN</span></div>
        <div class="ligne blanc" style="font-size:132px"><span data-layout-allow-occlusion data-layout-allow-overflow data-mot="0.60">TOUT</span> <span data-layout-allow-occlusion data-layout-allow-overflow data-mot="0.78">CHANGE</span></div>
      </div>

      <!-- GROUPE 2 : blanc + mot manuscrit qui chevauche + blanc. TEXTE D'EXEMPLE À REMPLACER. -->
      <div class="groupe" data-debut="1.10">
        <div class="ligne blanc" style="font-size:118px"><span data-layout-allow-occlusion data-layout-allow-overflow data-mot="1.12">LA</span> <span data-layout-allow-occlusion data-layout-allow-overflow data-mot="1.30">MÉTHODE</span></div>
        <div class="ligne script" style="font-size:150px"><span data-layout-allow-occlusion data-layout-allow-overflow data-mot="1.62">la plus simple</span></div>
        <div class="ligne blanc" style="font-size:136px"><span data-layout-allow-occlusion data-layout-allow-overflow data-mot="2.05">DU</span> <span data-layout-allow-occlusion data-layout-allow-overflow data-mot="2.20">MOMENT</span></div>
      </div>

      <!-- GROUPE 3 (facultatif, à supprimer si la phrase tient en 2 groupes) : appel + blanc penché
           + mot manuscrit chaud. TEXTE D'EXEMPLE À REMPLACER. -->
      <div class="groupe" data-debut="2.55">
        <div class="ligne appel" style="font-size:100px"><span data-layout-allow-occlusion data-layout-allow-overflow data-mot="2.57">N'EST</span> <span data-layout-allow-occlusion data-layout-allow-overflow data-mot="2.75">PLUS</span></div>
        <div class="ligne blanc penche" style="font-size:140px"><span data-layout-allow-occlusion data-layout-allow-overflow data-mot="2.90">CELLE</span></div>
        <div class="ligne script chaud" style="font-size:132px"><span data-layout-allow-occlusion data-layout-allow-overflow data-mot="3.05">d'avant</span></div>
      </div>

    </div>
  </div>
  <script>
    (function () {
      var ID = 'accroche-choc'; // = id de la section (tools/sections.py)
      var scope = '#' + ID + ' ';
      var root = document.getElementById(ID);
      // Durée de la section : au rendu, la racine peut perdre son data-duration (il passe à l'hôte du master) :
      // on la lit sur le panneau, sinon sur la racine ou son hôte.
      var DUREE = parseFloat((root.querySelector('.panneau') || root).getAttribute('data-duration'));
      if (isNaN(DUREE)) { var hote = root.closest('[data-duration]'); DUREE = hote ? parseFloat(hote.getAttribute('data-duration')) : 0; }
      var FLASH = 0.15;            // montée du flash avant la coupe (s)
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var groupes = root.querySelectorAll('.groupe');
      var debuts = [];
      groupes.forEach(function (g, i) { g.classList.add('g' + i); debuts.push(parseFloat(g.getAttribute('data-debut')) || 0); });
      var n = 0;
      groupes.forEach(function (g, i) {
        // Un groupe remplace le précédent d'un coup (coupe sèche du titre).
        tl.set(scope + '.g' + i, { opacity: 1 }, debuts[i]);
        if (i + 1 < groupes.length) tl.set(scope + '.g' + i, { opacity: 0 }, debuts[i + 1]);
        g.querySelectorAll('span[data-mot]').forEach(function (s) {
          var cls = 'm' + (n++);
          s.classList.add(cls);
          var t = parseFloat(s.getAttribute('data-mot'));
          var script = s.parentNode.classList.contains('script');
          // Chaque mot arrive quand il est dit : fondu + léger rétrécissement (jamais x/y).
          tl.fromTo(scope + '.' + cls, { opacity: 0, scale: script ? 1.25 : 1.14 },
            { opacity: 1, scale: 1, duration: script ? 0.28 : 0.18, ease: 'expo.out' }, Math.max(0, t));
        });
      });
      // Flash : monte avant la coupe, la section suivante le fait redescendre.
      tl.fromTo(scope + '.flash', { opacity: 0 }, { opacity: 0.92, duration: FLASH, ease: 'power2.in' }, Math.max(0, DUREE - FLASH));
      tl.set(scope + '.flash', { opacity: 0.92 }, DUREE - 0.001);
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
