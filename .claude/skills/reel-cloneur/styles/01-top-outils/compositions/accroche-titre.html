<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°01 · TOP OUTILS · PIÈCE « ACCROCHE TITRE » (les 2 à 4 premières s)    ║
    ╠══════════════════════════════════════════════════════════════════════════════╣
    ║ CE QUE C'EST : la phrase d'accroche écrite en très gros, mot à mot sur la      ║
    ║   voix, en deux blocs : au-dessus de la tête, puis sur le torse. Grotesque     ║
    ║   très grasse et serrée, blanche ; UN mot (le chiffre, ou le mot fort) dans    ║
    ║   l'accent. Chaque mot arrive flou et un peu grand, puis se pose. Autour de    ║
    ║   la tête flottent 4 à 6 tuiles de logos, certaines floues comme au second     ║
    ║   plan, qui dérivent doucement.                                                ║
    ║ TAILLE : section « decor » 1080×1920, fond TRANSPARENT, 2 à 4 s. Bloc haut     ║
    ║   entre y 160 et le haut de la tête ; bloc bas entre y 1110 et 1480 ; logos    ║
    ║   entre les deux, hors du visage.                                              ║
    ║ QUAND : la première section du Reel, sur la phrase d'accroche. Sans            ║
    ║   sous-titres (montage_captions.py --sans <id>) : le titre les remplace.       ║
    ║ À REMPLACER :                                                                  ║
    ║  1. l'id « accroche-titre » PARTOUT (CSS, HTML, constante ID), fichier         ║
    ║     compositions/<id>.html ;                                                   ║
    ║  2. les deux data-duration="3" par la durée de la section ;                    ║
    ║  3. le bloc DONNÉES : LIGNES (mots, taille en px, t = instant où le mot est    ║
    ║     dit, depuis le début de la section, accent: true sur UN mot) et LOGOS ;    ║
    ║  4. LOGOS : `src` = emplacement d'un logo du Reel (assets/logos/<outil>.svg,   ║
    ║     skill thesvg, couleurs d'origine) ; null = pastille avec l'initiale.       ║
    ║ Le haut de la tête du client fixe la limite basse du bloc haut (--tete-haut).  ║
    ║ Couleurs et polices : var(--brand-*) (mots = text, mot fort = accent).        ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #accroche-titre { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      font-family:var(--brand-font-body); color:var(--brand-text); --tete-haut:460px; }
    #accroche-titre * { box-sizing:border-box; }
    #accroche-titre .bloc { position:absolute; left:90px; right:90px; display:flex; flex-direction:column;
      align-items:center; }
    #accroche-titre .bloc-haut { top:150px; height:calc(var(--tete-haut) - 160px); justify-content:flex-end; }
    #accroche-titre .bloc-bas { top:1110px; }
    #accroche-titre .ligne { display:flex; align-items:baseline; justify-content:center;
      white-space:nowrap; line-height:0.86; }
    #accroche-titre .mot { display:inline-block; font-weight:900; letter-spacing:-0.055em; opacity:0;
      text-shadow:0 4px 26px color-mix(in srgb, var(--brand-bg) 55%, transparent), 0 0 3px color-mix(in srgb, var(--brand-bg) 35%, transparent); }
    #accroche-titre .mot + .mot { margin-left:0.24em; }
    #accroche-titre .mot.accent { color:var(--brand-accent); }
    #accroche-titre .tuile { position:absolute; display:flex; align-items:center; justify-content:center;
      border-radius:24%; overflow:hidden; background:var(--brand-text); opacity:0;
      box-shadow:0 10px 30px color-mix(in srgb, var(--brand-bg) 45%, transparent); }
    #accroche-titre .tuile.sombre { background:var(--brand-bg); }
    #accroche-titre .tuile img { width:64%; height:64%; object-fit:contain; }
    #accroche-titre .tuile .initiale { font-weight:900; font-size:0.5em; color:var(--brand-bg); }
    #accroche-titre .tuile.sombre .initiale { color:var(--brand-text); }
  </style>
</head>
<body>
  <div id="accroche-titre" data-composition-id="accroche-titre" data-start="0" data-duration="3"
       data-fps="30" data-width="1080" data-height="1920">
    <div id="accroche-titre-panel" class="clip" data-start="0" data-duration="3" data-track-index="0">
      <div class="tuiles"></div>
      <!-- Interligne serré voulu : les lignes se touchent, comme l'original. -->
      <div class="bloc bloc-haut" data-layout-allow-overlap></div>
      <div class="bloc bloc-bas" data-layout-allow-overlap></div>
    </div>
  </div>
  <script>
    (function () {
      var ID = 'accroche-titre';          // à renommer avec le CSS et le HTML
      var S = '#' + ID + ' ';
      // >>> DONNÉES (à remplacer ; exemple neutre : « Les 3 outils que j'utilise chaque jour »)
      var LIGNES = [
        { bloc: 'haut', mots: [ { m: 'Les', taille: 170, t: 0.05 }, { m: '3', taille: 170, t: 0.2, accent: true } ] },
        { bloc: 'haut', mots: [ { m: 'outils', taille: 150, t: 0.45 } ] },
        { bloc: 'bas',  mots: [ { m: 'que', taille: 70, t: 0.8 }, { m: "j'utilise", taille: 90, t: 0.95 } ] },
        { bloc: 'bas',  mots: [ { m: 'chaque', taille: 90, t: 1.3 } ] },
        { bloc: 'bas',  mots: [ { m: 'jour', taille: 180, t: 1.55 } ] }
      ];
      // Tuiles flottantes : x, y = centre (px), taille (px), flou (px, 0 = net, 4 à 9 = second plan).
      var LOGOS = [
        { src: null, nom: 'A', x: 190, y: 640, taille: 150, flou: 0 },
        { src: null, nom: 'B', x: 880, y: 560, taille: 120, flou: 7, sombre: true },
        { src: null, nom: 'C', x: 905, y: 905, taille: 130, flou: 3 },
        { src: null, nom: 'D', x: 160, y: 930, taille: 115, flou: 8, sombre: true },
        { src: null, nom: 'E', x: 790, y: 1040, taille: 150, flou: 0 }
      ];
      // <<< DONNÉES
      var root = document.getElementById(ID);
      var blocs = { haut: root.querySelector('.bloc-haut'), bas: root.querySelector('.bloc-bas') };
      var n = 0;
      LIGNES.forEach(function (l) {
        var ligne = document.createElement('div'); ligne.className = 'ligne';
        l.mots.forEach(function (w) {
          var s = document.createElement('span'); s.className = 'mot mot-' + n + (w.accent ? ' accent' : '');
          s.textContent = w.m; s.style.fontSize = w.taille + 'px'; w.n = n++;
          s.setAttribute('data-layout-allow-overlap', '');   // interligne serré voulu
          ligne.appendChild(s);
        });
        blocs[l.bloc].appendChild(ligne);
      });
      var tuiles = root.querySelector('.tuiles');
      LOGOS.forEach(function (g, i) {
        var t = document.createElement('div'); t.className = 'tuile tuile-' + i + (g.sombre ? ' sombre' : '');
        t.style.width = g.taille + 'px'; t.style.height = g.taille + 'px'; t.style.fontSize = g.taille + 'px';
        t.style.left = (g.x - g.taille / 2) + 'px'; t.style.top = (g.y - g.taille / 2) + 'px';
        t.style.filter = 'blur(' + g.flou + 'px)';
        if (g.src) { var img = document.createElement('img'); img.src = g.src; img.alt = ''; t.appendChild(img); }
        else { var ini = document.createElement('span'); ini.className = 'initiale'; ini.textContent = (g.nom || '?').charAt(0); t.appendChild(ini); }
        tuiles.appendChild(t);
      });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var duree = parseFloat(root.getAttribute('data-duration'));
      // Tuiles : apparition en 0,4 s, puis dérive lente (déplacement = x/y, déterministe).
      LOGOS.forEach(function (g, i) {
        var T = S + '.tuile-' + i;
        tl.fromTo(T, { opacity: 0, scale: 0.6 }, { opacity: g.flou > 5 ? 0.8 : 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)' }, 0.05 + i * 0.07);
        tl.fromTo(T, { x: 0, y: 0, rotation: (i % 2 ? 4 : -4) }, { x: (i % 2 ? -14 : 14), y: -26 - (i % 3) * 8, rotation: (i % 2 ? -3 : 3), duration: duree, ease: 'none' }, 0);
      });
      // Mots : flous et un peu grands, ils se posent sur la voix.
      LIGNES.forEach(function (l) {
        l.mots.forEach(function (w) {
          tl.fromTo(S + '.mot-' + w.n, { opacity: 0, scale: 1.35, filter: 'blur(16px)' },
            { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.22, ease: 'power3.out' }, w.t);
        });
      });
      tl.set(S + '.bloc-haut', { opacity: 1 }, duree);
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
