<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
  STYLE N°02 · CARTE CRÈME · PIÈCE SIGNATURE : LA CARTE D'ACCROCHE
  CE QUE C'EST : l'ouverture du Reel. Pas de plaque : trois éléments posés directement sur la vidéo
  filmée, centrés, dans le haut de l'image. (1) le bloc du sujet : son logo dans un bloc de couleur
  (232 px de haut, y 246 à 478) ; (2) une pastille claire arrondie avec le titre de la liste en
  condensé noir (y 515 à ~660) ; (3) une ligne entre parenthèses, en blanc avec l'ombre douce des
  sous-titres (centrée vers y 724).
  TAILLE : section 1080 x 1920, fond TRANSPARENT, cadrage « decor » dans tools/sections.py (la vidéo
  filmée reste entière dessous). Haut de la tête vers 44 % de la hauteur (recadrage du style).
  QUAND : la première section, de 0 s à la fin de la phrase d'accroche (4 à 6 s), d'un seul tenant :
  rien ne change pendant qu'elle est là. AUCUN SOUS-TITRE sur cette section :
  python3 tools/montage_captions.py --mots 1 --sans <id de cette section>.
  À REMPLACER :
    1. BLOC DU SUJET : le texte « Ton sujet » est un emplacement. Le vrai : le logo du sujet de la
       vidéo (l'outil, la marque, le thème) dans son bloc de couleur, en SVG qui porte déjà son fond
       (assets/logos/<sujet>-bloc.svg : logo officiel via le skill thesvg, ou fichier du client).
       Remplace alors tout le div .sujet par la ligne commentée <img class="sujet-logo" …>.
       Sans logo (sujet sans marque) : garde le div .sujet avec 1 ou 2 mots, 12 caractères au plus.
    2. PASTILLE : le titre de la liste, tel que la voix l'annonce ou presque (« Mes 5 outils pour
       aller plus vite », « 3 erreurs qui te coûtent des clients »). 36 caractères au plus sur une
       ligne ; au-delà, raccourcis-le plutôt que de le couper en deux.
    3. PARENTHÈSE : la promesse ou la nuance, entre parenthèses, 34 caractères au plus.
    Aucun chiffre ni nom que la voix ou le client ne donne.

  COULEURS ET POLICES : uniquement var(--brand-*), venues du reel.config.json du kit (ou des
  réglages du client s'il garde les siennes). Aucune couleur en dur : n'en ajoute pas.
  RIEN NE BOUGE : pas d'entrée animée, pas de fondu ni de glissé. La carte arrive d'un coup, au mot,
  et la suivante la remplace d'un coup (les clips suffisent, la timeline reste vide).
  CSS : le même bloc dans les trois pièces du kit, scopé sous l'id de la pièce. N'importe quelle
  carte (titre, schéma, variantes) se colle donc dans n'importe quelle section du style.
  RENOMMER pour une section : remplace « carte-accroche » partout dans ce fichier (CSS, id, data-composition-id,
  timeline) par l'id de la section dans tools/sections.py, et nomme le fichier compositions/<id>.html.
  DURÉE : data-duration de la racine = durée de la section (python3 tools/sections.py l'affiche) ;
  les clips de cartes se suivent sans trou et finissent avec elle.
  Contrôle : npm run check, puis npx hyperframes snapshot --at <instants> --describe false.
  Fiche du style : style.md, à côté du dossier compositions/ de ce kit.
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    /* ---- Racine : la section entière, 1080 x 1920, fond TRANSPARENT (la vidéo filmée passe dessous). */
    #carte-accroche { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      font-family:var(--brand-font-body); color:var(--brand-text); }
    #carte-accroche * { box-sizing:border-box; margin:0; }

    /* ---- La plaque : aplat du fond du style, angles droits, en haut (x 64 à 1016, y 200 à 740). */
    #carte-accroche .plaque { position:absolute; left:64px; top:200px; width:952px; height:540px;
      background:var(--brand-bg); }
    /* La carte posée dans la plaque : arrondie, bord et ombre très légers. */
    #carte-accroche .carte { position:absolute; left:22px; right:22px; border-radius:28px;
      background:var(--brand-surface);
      border:2px solid color-mix(in srgb, var(--brand-text) 7%, transparent);
      box-shadow:0 8px 22px color-mix(in srgb, var(--brand-text) 8%, transparent); }
    #carte-accroche .forme-titre { top:64px; bottom:64px; }
    #carte-accroche .forme-schema { top:22px; bottom:22px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:72px 36px 28px; }
    /* Éclat : petit ornement facultatif, coin haut droit de la carte. */
    #carte-accroche .eclat { position:absolute; top:18px; right:20px; width:30px; height:30px;
      color:var(--brand-muted); opacity:.55; }

    /* ---- Carte titre : étiquette, grand titre condensé, trait, ligne grise, mini-schéma. */
    #carte-accroche .etiquette { position:absolute; left:44px; top:28px; right:330px; display:flex;
      align-items:center; gap:14px; color:var(--brand-accent); font-weight:700; font-size:26px;
      letter-spacing:3px; text-transform:uppercase; white-space:nowrap; }
    #carte-accroche .losange { width:14px; height:14px; background:var(--brand-accent); transform:rotate(45deg);
      flex:none; }
    #carte-accroche .filet { flex:1; height:2px; background:color-mix(in srgb, var(--brand-muted) 35%, transparent); }
    #carte-accroche .t { position:absolute; left:44px; top:98px; width:540px; font-family:var(--brand-font-display);
      font-size:116px; line-height:1; color:var(--brand-text); white-space:nowrap; }
    #carte-accroche .t.deux { top:86px; line-height:.96; }
    #carte-accroche .trait { position:absolute; left:44px; bottom:92px; width:46px; height:4px;
      background:var(--brand-accent); }
    #carte-accroche .ligne { position:absolute; left:44px; bottom:30px; width:540px; font-size:28px;
      line-height:1.25; color:var(--brand-muted); white-space:nowrap; }
    /* Mini-schéma : une tuile centrale reliée en pointillés accent à 2 ou 3 petites tuiles. */
    #carte-accroche .mini { position:absolute; right:24px; top:50%; width:300px; height:300px; margin-top:-150px; }
    #carte-accroche .liens { position:absolute; inset:0; width:300px; height:300px; fill:none;
      stroke:var(--brand-accent); stroke-width:2.5; stroke-dasharray:3 7; stroke-linecap:round; }
    /* Tuiles : un cran plus claires que la carte (--brand-stroke = l'opposé du texte, blanc ici). */
    #carte-accroche .sat, #carte-accroche .centre, #carte-accroche .tuile { display:flex; align-items:center; justify-content:center;
      background:color-mix(in srgb, var(--brand-surface) 55%, var(--brand-stroke));
      border:2px solid color-mix(in srgb, var(--brand-text) 10%, transparent);
      box-shadow:0 4px 12px color-mix(in srgb, var(--brand-text) 7%, transparent); }
    #carte-accroche .sat { position:absolute; width:62px; height:62px; border-radius:16px; color:var(--brand-text); }
    #carte-accroche .sat > svg, #carte-accroche .sat > img { width:36px; height:36px; }
    #carte-accroche .centre { position:absolute; left:98px; top:98px; width:104px; height:104px;
      border-radius:24px; color:var(--brand-accent); }
    #carte-accroche .centre > svg { width:56px; height:56px; }
    #carte-accroche .centre > img { width:62px; height:62px; }

    /* ---- Carte schéma : en-tête, colonnes de tuiles reliées par des flèches accent. */
    #carte-accroche .entete { position:absolute; left:40px; top:30px; display:flex; align-items:center; gap:14px;
      color:var(--brand-accent); font-weight:700; font-size:26px; letter-spacing:3px;
      text-transform:uppercase; white-space:nowrap; }
    #carte-accroche .rang { display:flex; align-items:center; justify-content:center; gap:18px; }
    /* Étapes : colonnes alignées par le haut (numéros sur une ligne), flèches au milieu. */
    #carte-accroche .etapes { align-items:flex-start; }
    #carte-accroche .etapes > .fleche { align-self:center; }
    #carte-accroche .col { display:flex; flex-direction:column; align-items:center; gap:16px; }
    #carte-accroche .num { font-family:var(--brand-font-display); font-size:30px; line-height:1; color:var(--brand-accent); }
    #carte-accroche .tuile { position:relative; width:150px; height:150px; border-radius:32px; color:var(--brand-text); }
    #carte-accroche .tuile > svg { width:76px; height:76px; }
    #carte-accroche .tuile > img { width:90px; height:90px; }
    #carte-accroche .tuile.forte { color:var(--brand-accent);
      border-color:color-mix(in srgb, var(--brand-accent) 45%, transparent); }
    #carte-accroche .tuile.petite { width:104px; height:104px; border-radius:24px; }
    #carte-accroche .tuile.petite > svg { width:52px; height:52px; }
    #carte-accroche .tuile.petite > img { width:62px; height:62px; }
    #carte-accroche .leg { font-size:30px; font-weight:600; color:var(--brand-text); white-space:nowrap; }
    #carte-accroche .leg.doux { font-weight:400; color:var(--brand-muted); }
    #carte-accroche .fleche { width:72px; height:32px; color:var(--brand-accent); flex:none; }
    #carte-accroche .puce { display:inline-flex; align-items:center; gap:10px; padding:8px 18px; border-radius:999px;
      background:color-mix(in srgb, var(--brand-accent) 14%, transparent); color:var(--brand-text);
      font-size:26px; font-weight:700; white-space:nowrap; }
    #carte-accroche .puce > svg { width:28px; height:28px; color:var(--brand-accent); }
    #carte-accroche .liste { display:flex; flex-direction:column; gap:20px; }
    #carte-accroche .item { display:flex; align-items:center; gap:16px; font-size:32px; font-weight:600; white-space:nowrap; }
    #carte-accroche .coche { width:44px; height:44px; border-radius:12px; display:flex; align-items:center;
      justify-content:center; background:var(--brand-accent); color:var(--brand-surface); flex:none; }
    #carte-accroche .coche > svg { width:26px; height:26px; stroke-width:2.6; }
    #carte-accroche .badge { position:absolute; right:-14px; top:-14px; width:46px; height:46px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; }
    #carte-accroche .badge > svg { width:28px; height:28px; stroke-width:2.6; }
    #carte-accroche .badge-ok { background:var(--brand-accent); color:var(--brand-surface); }
    #carte-accroche .badge-non { background:var(--brand-text); color:var(--brand-surface); }
    /* Variante « comparaison en barres » (chiffres donnés par la voix ou le client, jamais inventés). */
    #carte-accroche .compare { width:100%; display:flex; flex-direction:column; gap:40px; }
    #carte-accroche .barre { display:grid; grid-template-columns:60px 300px 1fr 150px; align-items:center; gap:20px; }
    #carte-accroche .barre > svg, #carte-accroche .barre > img { width:56px; height:56px; color:var(--brand-text); }
    #carte-accroche .nom { font-size:32px; font-weight:600; white-space:nowrap; }
    #carte-accroche .rail { height:30px; border-radius:15px; background:color-mix(in srgb, var(--brand-text) 6%, transparent); }
    #carte-accroche .val { height:100%; border-radius:15px; background:color-mix(in srgb, var(--brand-text) 78%, transparent); }
    #carte-accroche .val.accent { background:var(--brand-accent); }
    #carte-accroche .chiffre { font-family:var(--brand-font-display); font-size:54px; text-align:right; white-space:nowrap; }
    #carte-accroche .chiffre.accent { color:var(--brand-accent); }

    /* ---- Carte d'accroche (sans plaque) : bloc du sujet, pastille titre, ligne entre parenthèses. */
    #carte-accroche .sujet { position:absolute; left:50%; top:246px; transform:translateX(-50%); height:232px;
      min-width:460px; padding:0 64px; display:flex; align-items:center; justify-content:center; gap:28px;
      background:var(--brand-accent); color:var(--brand-surface);
      font-family:var(--brand-font-display); font-size:104px; line-height:1; white-space:nowrap; }
    #carte-accroche .sujet-logo { position:absolute; left:50%; top:246px; transform:translateX(-50%);
      height:232px; width:auto; max-width:820px; }
    #carte-accroche .pastille { position:absolute; left:50%; top:515px; transform:translateX(-50%);
      padding:38px 44px 42px; border-radius:24px;
      background:color-mix(in srgb, var(--brand-surface) 55%, var(--brand-stroke));
      font-family:var(--brand-font-display); font-size:56px; line-height:1.05; color:var(--brand-text);
      white-space:nowrap; }
    /* La parenthèse reprend l'allure des sous-titres (classe .cap du style : blanc, ombre douce). */
    #carte-accroche .parenthese.cap { top:724px; font-size:46px; font-weight:600; }
  </style>
</head>
<body>
  <div id="carte-accroche" data-composition-id="carte-accroche" data-start="0" data-duration="5.00000" data-fps="30" data-width="1080" data-height="1920">
      <!-- Carte d'accroche : de 0 à la fin de la section, d'un seul tenant. -->
      <div id="carte-accroche-carte-0" class="clip" data-start="0.00000" data-duration="5.00000" data-track-index="0" style="position:absolute; inset:0;">
        <!-- 1. BLOC DU SUJET (emplacement). Avec le logo du sujet en bloc de couleur, remplace ce div par :
             <img class="sujet-logo" src="assets/logos/SUJET-bloc.svg" alt="">  -->
        <div class="sujet">Ton sujet</div>
        <!-- 2. PASTILLE : le titre de la liste. -->
        <div class="pastille">Mes 5 outils pour aller plus vite</div>
        <!-- 3. PARENTHÈSE : la promesse ou la nuance. -->
        <div class="cap parenthese">(et le dernier change tout)</div>
      </div>
  </div>
  <script>
    (function () {
      // Rien ne bouge dans ce style : chaque carte arrive d'un coup et remplace la précédente.
      // Leur visibilité vient des clips (data-start / data-duration), la timeline reste vide.
      window.__timelines = window.__timelines || {};
      window.__timelines["carte-accroche"] = gsap.timeline({ paused: true });
    })();
  </script>
</body>
</html>
