<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°01 · FENÊTRE ORANGE · PIÈCE « CARTE CAPTURE » (la fenêtre sur le torse) ║
    ╠══════════════════════════════════════════════════════════════════════════════╣
    ║ CE QUE C'EST : une fenêtre arrondie à bord orange (accent), posée sur le torse ║
    ║   (x 205 à 880, y 1100 à 1515), qui montre une suite de « vues » : captures    ║
    ║   d'écran d'un site ou d'une appli, listes dessinées (logos, noms, coches,     ║
    ║   étiquettes), échanges de messages. Chaque vue arrive floue puis nette en     ║
    ║   0,2 s ; une nouvelle vue toutes les 1 à 2 s, c'est le rythme du style.       ║
    ║ TAILLE : section « decor » 1080×1920, fond TRANSPARENT ; la fenêtre fait       ║
    ║   675×415 px. Les sous-titres (un mot géant) restent au-dessus de la tête.     ║
    ║ QUAND : pendant qu'on parle d'un outil, après sa carte « titre » ; et sur      ║
    ║   tout passage qui se montre (ce que fait l'outil, un réglage, un résultat).   ║
    ║ À REMPLACER :                                                                  ║
    ║  1. l'id « carte-capture » PARTOUT (CSS, HTML, constante ID) par l'id de la    ║
    ║     section, fichier compositions/<id>.html ;                                  ║
    ║  2. les deux data-duration="6" par la durée de la section ;                    ║
    ║  3. le bloc DONNÉES : la liste VUES, une entrée par vue, `t` = départ en       ║
    ║     secondes depuis le début de la section (caler sur les mots, fichier        ║
    ║     derush/<vidéo>_words.json, moins le début de la section) :                 ║
    ║     - { t, type:'image', src:'assets/images/captures/<x>.png', cadrage:'center top',
    ║         defile: 0 (px de défilement vers le haut pendant la vue),             ║
    ║         surligne: { x, y, w, h, t } (trait de surligneur, px dans la fenêtre) }║
    ║       CAPTURE = emplacement : une capture 1350×830 px d'un site public ou de   ║
    ║       l'appli du client, faite par le monteur (jamais une image générée) ;     ║
    ║     - { t, type:'liste', titre, logo, lignes:[{ texte, logo, etiquette, coche,  ║
    ║         barre, t }], actif:[{ ligne, t }] }  (logos : assets/logos/, thesvg ;  ║
    ║         sans logo, une pastille avec l'initiale) ;                             ║
    ║     - { t, type:'chat', titre, logo, bulles:[{ cote:'moi'|'ia', texte, coche, t }] }
    ║       (texte '' = bulle grisée, sans texte inventé).                          ║
    ║ Aucun chiffre que la vidéo ne dit pas : une ligne sans chiffre plutôt.         ║
    ║ Couleurs et polices : var(--brand-*) (bord et surligneur = accent, fond = bg).  ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #carte-capture { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      font-family:var(--brand-font-body); color:var(--brand-text); }
    #carte-capture * { box-sizing:border-box; }
    #carte-capture .fenetre { position:absolute; left:203px; top:1100px; width:675px; height:415px;
      border:5px solid var(--brand-accent); border-radius:22px; overflow:hidden;
      background:var(--brand-bg);
      box-shadow:0 18px 50px color-mix(in srgb, var(--brand-bg) 55%, transparent); }
    #carte-capture .vue { position:absolute; inset:0; opacity:0; overflow:hidden; background:var(--brand-bg); }
    #carte-capture .vue > img { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; }
    #carte-capture .surligne { position:absolute; background:var(--brand-accent); opacity:0.42;
      mix-blend-mode:multiply; transform-origin:0 50%; border-radius:4px; }
    /* Vues dessinées : barre de titre + lignes, à la manière d'une appli sombre. */
    #carte-capture .barre-titre { position:absolute; left:0; right:0; top:0; height:66px; display:flex;
      align-items:center; gap:14px; padding:0 26px; font-size:30px; font-weight:700; letter-spacing:-0.01em;
      border-bottom:2px solid color-mix(in srgb, var(--brand-muted) 35%, transparent); }
    #carte-capture .barre-titre .points { margin-left:auto; display:flex; gap:9px; }
    #carte-capture .barre-titre .points i { width:13px; height:13px; border-radius:50%;
      background:color-mix(in srgb, var(--brand-muted) 70%, transparent); }
    #carte-capture .lignes { position:absolute; left:22px; right:22px; top:84px; display:flex;
      flex-direction:column; gap:10px; }
    #carte-capture .ligne { position:relative; height:70px; display:flex; align-items:center; gap:18px;
      padding:0 16px; border-radius:14px; opacity:0;
      background:color-mix(in srgb, var(--brand-text) 6%, transparent); }
    #carte-capture .ligne .actif { position:absolute; inset:0; border-radius:14px; opacity:0;
      border:3px solid var(--brand-accent); background:color-mix(in srgb, var(--brand-accent) 16%, transparent); }
    #carte-capture .ligne .texte { position:relative; font-size:34px; font-weight:700; letter-spacing:-0.015em;
      white-space:nowrap; }
    #carte-capture .ligne .barre { position:absolute; left:-6px; right:-6px; top:52%; height:7px;
      border-radius:4px; background:var(--brand-accent); transform:scaleX(0); transform-origin:0 50%; }
    #carte-capture .etiquette { position:relative; margin-left:auto; padding:6px 16px; border-radius:999px;
      font-size:24px; font-weight:700; white-space:nowrap; background:var(--brand-accent);
      color:var(--brand-contrast); opacity:0; }
    #carte-capture .coche { position:relative; margin-left:auto; width:40px; height:40px; opacity:0;
      color:var(--brand-accent); }
    #carte-capture .logo { position:relative; flex:none; width:48px; height:48px; border-radius:12px;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
      background:var(--brand-text); }
    #carte-capture .logo img { width:76%; height:76%; object-fit:contain; }
    #carte-capture .logo.sombre { background:color-mix(in srgb, var(--brand-text) 12%, var(--brand-bg)); }
    #carte-capture .logo .initiale { font-size:28px; font-weight:900; color:var(--brand-bg); }
    #carte-capture .barre-titre .logo { width:40px; height:40px; border-radius:10px; }
    /* Échange de messages. */
    #carte-capture .bulles { position:absolute; left:24px; right:24px; top:88px; bottom:20px;
      display:flex; flex-direction:column; gap:16px; }
    #carte-capture .bulle { max-width:78%; padding:18px 24px; border-radius:24px; font-size:30px;
      font-weight:600; line-height:1.25; opacity:0; display:flex; align-items:center; gap:14px; }
    #carte-capture .bulle.moi { align-self:flex-end; border-bottom-right-radius:8px;
      background:color-mix(in srgb, var(--brand-text) 16%, var(--brand-bg)); }
    #carte-capture .bulle.ia { align-self:flex-start; border-bottom-left-radius:8px;
      background:color-mix(in srgb, var(--brand-text) 7%, var(--brand-bg));
      border:2px solid color-mix(in srgb, var(--brand-muted) 40%, transparent); }
    #carte-capture .bulle .gris { display:flex; flex-direction:column; gap:10px; }
    #carte-capture .bulle .gris i { display:block; height:14px; border-radius:7px; width:260px;
      background:color-mix(in srgb, var(--brand-muted) 70%, transparent); }
    #carte-capture .bulle .gris i + i { width:170px; }
    #carte-capture .bulle .coche { margin-left:0; opacity:1; width:34px; height:34px; }
  </style>
</head>
<body>
  <div id="carte-capture" data-composition-id="carte-capture" data-start="0" data-duration="6"
       data-fps="30" data-width="1080" data-height="1920">
    <div id="carte-capture-panel" class="clip" data-start="0" data-duration="6" data-track-index="0">
      <!-- Les vues se succèdent au même endroit (fondu de 0,2 s) : chevauchement voulu. -->
      <div class="fenetre" data-layout-allow-overlap></div>
    </div>
  </div>
  <script>
    (function () {
      var ID = 'carte-capture';           // à renommer avec le CSS et le HTML
      var S = '#' + ID + ' ';
      // >>> DONNÉES (à remplacer ; textes d'exemple neutres, aucune capture ni aucun logo réel)
      var VUES = [
        { t: 0, type: 'liste', titre: 'Ce que fait l\'outil', lignes: [
          { texte: 'Il trie tes messages', coche: true, t: 0.3 },
          { texte: 'Il prépare tes réponses', coche: true, t: 1.0 },
          { texte: 'Il te fait un résumé', coche: true, t: 1.7 } ] },
        // Capture : { t: 2.4, type: 'image', src: 'assets/images/captures/<outil>-accueil.png',
        //   cadrage: 'center top', defile: 0, surligne: { x: 40, y: 60, w: 420, h: 46, t: 0.5 } },
        { t: 2.4, type: 'liste', titre: 'Avant / après', lignes: [
          { texte: 'Tout à la main', barre: true, t: 2.6 },
          { texte: 'Automatique', etiquette: 'nouveau', t: 3.2 } ],
          actif: [ { ligne: 1, t: 3.4 } ] },
        { t: 4.2, type: 'chat', titre: 'Ton outil', bulles: [
          { cote: 'moi', texte: '', t: 4.3 },
          { cote: 'ia', texte: 'C\'est fait.', coche: true, t: 4.9 } ] }
      ];
      // <<< DONNÉES
      var root = document.getElementById(ID);
      var fenetre = root.querySelector('.fenetre');
      var NS = 'http://www.w3.org/2000/svg';
      function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
      function coche() {
        var s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 40 40'); s.setAttribute('class', 'coche');
        s.innerHTML = '<circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="3"/>' +
          '<path d="M11 20.5l6 6 12-13" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
        return s;
      }
      function logo(src, nom, sombre) {
        var b = el('div', 'logo' + (sombre ? ' sombre' : ''));
        if (src) { var i = el('img'); i.src = src; i.alt = ''; b.appendChild(i); }
        else b.appendChild(el('span', 'initiale', (nom || '?').charAt(0)));
        return b;
      }
      function barreTitre(v) {
        var b = el('div', 'barre-titre');
        if (v.logo) b.appendChild(logo(v.logo, v.titre, v.logoSombre));
        var ti = el('span', '', v.titre || ''); ti.setAttribute('data-layout-allow-overlap', ''); b.appendChild(ti);
        var p = el('span', 'points'); p.appendChild(el('i')); p.appendChild(el('i')); p.appendChild(el('i'));
        b.appendChild(p); return b;
      }
      VUES.forEach(function (v, i) {
        var vue = el('div', 'vue vue-' + i);
        vue.setAttribute('data-layout-allow-overlap', '');   // vues successives au même endroit
        if (v.type === 'image') {
          var img = el('img'); img.src = v.src; img.alt = '';
          img.style.objectPosition = v.cadrage || 'center top';
          vue.appendChild(img);
          if (v.surligne) {
            var s = el('div', 'surligne');
            s.style.left = v.surligne.x + 'px'; s.style.top = v.surligne.y + 'px';
            s.style.width = v.surligne.w + 'px'; s.style.height = v.surligne.h + 'px';
            vue.appendChild(s);
          }
        } else if (v.type === 'liste') {
          vue.appendChild(barreTitre(v));
          var ls = el('div', 'lignes');
          (v.lignes || []).forEach(function (l, k) {
            var r = el('div', 'ligne ligne-' + k);
            r.appendChild(el('div', 'actif'));
            if (l.logo !== undefined) r.appendChild(logo(l.logo, l.texte, l.logoSombre));
            var tx = el('span', 'texte', l.texte); tx.setAttribute('data-layout-allow-overlap', ''); if (l.barre) tx.appendChild(el('i', 'barre')); r.appendChild(tx);
            if (l.etiquette) r.appendChild(el('span', 'etiquette', l.etiquette));
            if (l.coche) r.appendChild(coche());
            ls.appendChild(r);
          });
          vue.appendChild(ls);
        } else if (v.type === 'chat') {
          vue.appendChild(barreTitre(v));
          var bs = el('div', 'bulles');
          (v.bulles || []).forEach(function (b, k) {
            var bu = el('div', 'bulle ' + (b.cote === 'moi' ? 'moi' : 'ia') + ' bulle-' + k);
            if (b.texte) bu.appendChild(el('span', '', b.texte));
            else { var g = el('span', 'gris'); g.appendChild(el('i')); g.appendChild(el('i')); bu.appendChild(g); }
            if (b.coche) bu.appendChild(coche());
            bs.appendChild(bu);
          });
          vue.appendChild(bs);
        }
        fenetre.appendChild(vue);
      });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var duree = parseFloat(root.getAttribute('data-duration'));
      // La fenêtre arrive floue et transparente, nette en 0,2 s.
      tl.fromTo(S + '.fenetre', { opacity: 0, scale: 1.04, filter: 'blur(14px)' },
        { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.22, ease: 'power2.out' }, 0);
      VUES.forEach(function (v, i) {
        var V = S + '.vue-' + i;
        var fin = i + 1 < VUES.length ? VUES[i + 1].t : duree;
        if (i === 0) tl.set(V, { opacity: 1 }, 0);
        else tl.fromTo(V, { opacity: 0, filter: 'blur(12px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power2.out' }, v.t);
        if (i > 0) tl.set(S + '.vue-' + (i - 1), { opacity: 0 }, v.t + 0.2);
        if (v.type === 'image') {
          if (v.defile) tl.fromTo(V + ' > img', { y: 0 }, { y: -v.defile, duration: Math.max(0.3, fin - v.t), ease: 'none' }, v.t);
          if (v.surligne) tl.fromTo(V + ' .surligne', { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: 'power2.out' }, v.t + v.surligne.t);
        }
        (v.lignes || []).forEach(function (l, k) {
          var L = V + ' .ligne-' + k;
          tl.fromTo(L, { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'power2.out' }, l.t);
          if (l.barre) tl.fromTo(L + ' .barre', { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: 'power2.out' }, (l.tBarre !== undefined ? l.tBarre : l.t + 0.35));
          if (l.etiquette) tl.fromTo(L + ' .etiquette', { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'back.out(2)' }, (l.tEtiquette !== undefined ? l.tEtiquette : l.t + 0.15));
          if (l.coche) tl.fromTo(L + ' .coche', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.18, ease: 'back.out(2)' }, l.t + 0.12);
        });
        (v.actif || []).forEach(function (a, k) {
          (v.lignes || []).forEach(function (_, j) { tl.set(V + ' .ligne-' + j + ' .actif', { opacity: j === a.ligne ? 1 : 0 }, a.t); });
        });
        (v.bulles || []).forEach(function (b, k) {
          tl.fromTo(V + ' .bulle-' + k, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.2, ease: 'power2.out' }, b.t);
        });
      });
      tl.set(S + '.fenetre', { opacity: 1 }, duree);
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
