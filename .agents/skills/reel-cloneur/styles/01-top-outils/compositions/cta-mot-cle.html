<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°01 · TOP OUTILS · PIÈCE « CTA MOT-CLÉ » (la pilule de fin)             ║
    ╠══════════════════════════════════════════════════════════════════════════════╣
    ║ CE QUE C'EST : le mot-clé à commenter, entre guillemets typographiques, en     ║
    ║   noir très gras dans une pilule blanche, sur la poitrine (centre y = 1340).   ║
    ║   Elle arrive d'un petit rebond quand le mot-clé est dit et reste jusqu'à la   ║
    ║   fin ; le mot géant du haut (sous-titres) continue au-dessus de la tête.      ║
    ║ TAILLE : section « decor » 1080×1920, fond TRANSPARENT ; pilule ≈ 640 × 165 px ║
    ║   pour un mot de 6 à 8 lettres (plus long : baisser font-size, 124 px).        ║
    ║ QUAND : la dernière phrase, « commente X et je t'envoie… ». Garder les         ║
    ║   sous-titres (pas de --sans sur cette section).                               ║
    ║ À REMPLACER :                                                                  ║
    ║  1. l'id « cta-mot-cle » PARTOUT (CSS, HTML, constante ID), fichier            ║
    ║     compositions/<id>.html ;                                                   ║
    ║  2. les deux data-duration="3" par la durée de la section ;                    ║
    ║  3. le bloc DONNÉES : le mot-clé du client (cta.defaultKeyword, ou celui qu'il ║
    ║     dit) et `t`, l'instant où il le dit depuis le début de la section.         ║
    ║ Jamais le mot « lien » : 🔗 si besoin, dans la voix ou la légende.             ║
    ║ Couleurs et polices : var(--brand-*) (pilule = text, mot = bg).                ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #cta-mot-cle { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      font-family:var(--brand-font-body); }
    #cta-mot-cle .rangee { position:absolute; left:100px; right:100px; top:1340px; height:0;
      display:flex; justify-content:center; align-items:center; }
    #cta-mot-cle .pilule { position:relative; flex:none;
      padding:18px 72px 28px; border-radius:999px; background:var(--brand-text); color:var(--brand-bg);
      font-weight:900; font-size:124px; line-height:1; letter-spacing:-0.045em; white-space:nowrap;
      box-shadow:0 14px 40px color-mix(in srgb, var(--brand-bg) 45%, transparent); opacity:0; }
  </style>
</head>
<body>
  <div id="cta-mot-cle" data-composition-id="cta-mot-cle" data-start="0" data-duration="3"
       data-fps="30" data-width="1080" data-height="1920">
    <div id="cta-mot-cle-panel" class="clip" data-start="0" data-duration="3" data-track-index="0">
      <div class="rangee"><div class="pilule"></div></div>
    </div>
  </div>
  <script>
    (function () {
      var ID = 'cta-mot-cle';             // à renommer avec le CSS et le HTML
      var S = '#' + ID + ' ';
      // >>> DONNÉES (à remplacer)
      var DONNEES = { motCle: 'GUIDE', t: 0.4 };
      // <<< DONNÉES
      var root = document.getElementById(ID);
      root.querySelector('.pilule').textContent = '“' + DONNEES.motCle + '”';
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var duree = parseFloat(root.getAttribute('data-duration'));
      // Entrée : opacity + scale seulement (la rangée centre la pilule sur y = 1340).
      tl.fromTo(S + '.pilule', { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(2.2)' }, DONNEES.t);
      tl.set(S + '.pilule', { opacity: 1 }, duree);
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
