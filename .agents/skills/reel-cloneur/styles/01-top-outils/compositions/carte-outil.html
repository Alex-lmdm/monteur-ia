<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°01 · TOP OUTILS · PIÈCE « CARTE OUTIL » (la carte titre d'un outil)    ║
    ╠══════════════════════════════════════════════════════════════════════════════╣
    ║ CE QUE C'EST : l'arrivée d'un outil cité. Flash blanc, puis, d'un coup :       ║
    ║   une étiquette en serif italique tapée lettre à lettre au-dessus de la tête  ║
    ║   (le rang : PREMIER, DEUXIÈME… ou le mot qui l'annonce), une étoile jaune     ║
    ║   pâle derrière la tête, le logo de l'outil en tuile penchée, son nom en noir  ║
    ║   très gras sur un bandeau crème, à hauteur de poitrine.                       ║
    ║ TAILLE : section « decor » 1080×1920, fond TRANSPARENT (la vidéo filmée reste  ║
    ║   entière dessous). Durée conseillée 0,7 à 2,5 s : de « Premier, X » à la fin  ║
    ║   du nom de l'outil.                                                           ║
    ║ QUAND : à chaque outil, appli, site ou méthode qu'on présente (une carte par   ║
    ║   outil, jamais deux d'affilée sur le même). Sans sous-titres pendant la carte ║
    ║   (montage_captions.py --sans <id>).                                           ║
    ║ À REMPLACER :                                                                  ║
    ║  1. l'id « carte-outil » PARTOUT (CSS, HTML, constante ID) par l'id de la      ║
    ║     section (ex. s2-outil) et le fichier en compositions/<id>.html ;           ║
    ║  2. les deux data-duration="2" par la durée de la section (tools/sections.py) ;║
    ║  3. le bloc DONNÉES du script : étiquette, nom, sous-nom, logo, tuile ;        ║
    ║  4. LOGO : la ligne `logo` du bloc DONNÉES, un fichier du Reel                 ║
    ║     (assets/logos/<outil>.svg, skill thesvg, couleurs d'origine). Sans logo    ║
    ║     (null) la tuile montre l'initiale du nom ;                                 ║
    ║  5. l'étoile passe DERRIÈRE le client : `masque` = sa silhouette (PNG fait     ║
    ║     par outils/masque_etoile.py du kit, détourage local, rien de généré) ;     ║
    ║     sans masque, une ellipse autour de sa tête (--tete-x/y, --tete-rx/ry). Dans ║
    ║     les deux cas l'étoile est coupée sous ses épaules (--epaules-y).          ║
    ║ Couleurs et polices : var(--brand-*) du reel.config.json du style (étoile =    ║
    ║   surface, bandeau = surface éclaircie, nom = bg, étiquette = fontDisplay).    ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    /* Pas de règle sur html/body : au rendu, toutes les sections partagent un document. */
    #carte-outil { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      font-family:var(--brand-font-body); color:var(--brand-text);
      /* Tête du client (px, image 1080×1920) : centre, demi-largeur, demi-hauteur, bas des épaules. */
      --tete-x:540px; --tete-y:640px; --tete-rx:140px; --tete-ry:195px; --epaules-y:835px; }
    #carte-outil * { box-sizing:border-box; }
    /* Étoile derrière la tête : masque = hors de l'ellipse de la tête ET au-dessus des épaules. */
    #carte-outil .etoile-zone { position:absolute; inset:0;
      -webkit-mask-image:
        radial-gradient(ellipse var(--tete-rx) var(--tete-ry) at var(--tete-x) var(--tete-y), transparent 96%, black 100%),
        linear-gradient(to bottom, black calc(var(--epaules-y) - 24px), transparent var(--epaules-y));
      -webkit-mask-composite: source-in;
      mask-image:
        radial-gradient(ellipse var(--tete-rx) var(--tete-ry) at var(--tete-x) var(--tete-y), transparent 96%, black 100%),
        linear-gradient(to bottom, black calc(var(--epaules-y) - 24px), transparent var(--epaules-y));
      mask-composite: intersect; }
    #carte-outil .etoile { position:absolute; width:900px; height:720px;
      left:calc(var(--tete-x) - 450px); top:calc(var(--tete-y) - 370px); }
    #carte-outil .etoile polygon { fill:var(--brand-surface); }
    /* Étiquette : serif italique (fontDisplay du style), tapée, au-dessus de la tête. */
    #carte-outil .etiquette { position:absolute; left:100px; right:100px; top:205px; text-align:center;
      font-family:var(--brand-font-display); font-style:italic; font-weight:400; line-height:1;
      font-size:var(--taille-etiquette, 130px); letter-spacing:-0.01em; white-space:nowrap;
      color:var(--brand-text);
      text-shadow:0 3px 22px color-mix(in srgb, var(--brand-bg) 60%, transparent), 0 0 4px color-mix(in srgb, var(--brand-bg) 45%, transparent); }
    #carte-outil .etiquette .lettre { display:none; }   /* tapées : le mot grandit depuis le centre */
    #carte-outil .curseur { display:inline-block; width:5px; height:0.78em; margin-left:8px;
      vertical-align:-0.04em; background:var(--brand-text); }
    /* Tuile du logo, penchée, à gauche du torse ; elle passe sous le bandeau du nom. */
    #carte-outil .tuile { position:absolute; left:118px; top:952px; width:290px; height:290px;
      border-radius:66px; border:7px solid var(--brand-bg); background:var(--brand-text);
      transform:rotate(-6deg); display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #carte-outil .tuile.sombre { background:var(--brand-bg); }
    #carte-outil .tuile img { width:64%; height:64%; object-fit:contain; }
    #carte-outil .tuile .initiale { font-weight:900; font-size:170px; line-height:1; color:var(--brand-bg); }
    #carte-outil .tuile.sombre .initiale { color:var(--brand-text); }
    /* Nom : noir très gras sur bandeau crème (surface éclaircie vers le blanc du style). */
    #carte-outil .nom { position:absolute; left:60px; right:60px; top:1226px; text-align:center; }
    #carte-outil .nom span { display:inline-block; font-weight:900; line-height:0.84; letter-spacing:-0.045em;
      font-size:var(--taille-nom, 130px); color:var(--brand-bg); white-space:nowrap;
      background:color-mix(in srgb, var(--brand-surface) 38%, var(--brand-text)); padding:2px 16px 8px; }
    #carte-outil .sous-nom { position:absolute; left:60px; right:60px; text-align:center;
      top:calc(1226px + var(--taille-nom, 130px) * 0.84 + 14px); }
    #carte-outil .sous-nom span { display:inline-block; font-weight:900; font-size:64px; line-height:0.9;
      letter-spacing:-0.03em; color:var(--brand-bg); white-space:nowrap;
      background:color-mix(in srgb, var(--brand-surface) 38%, var(--brand-text)); padding:2px 12px 6px; }
    /* Flash blanc d'entrée (plein cadre, au-dessus de tout, s'efface en 0,4 s). */
    #carte-outil .flash { position:absolute; inset:0; background:var(--brand-text); opacity:0; }
  </style>
</head>
<body>
  <div id="carte-outil" data-composition-id="carte-outil" data-start="0" data-duration="2"
       data-fps="30" data-width="1080" data-height="1920">
    <div id="carte-outil-panel" class="clip" data-start="0" data-duration="2" data-track-index="0">
      <div class="etoile-zone">
        <svg class="etoile" viewBox="0 0 900 720" aria-hidden="true">
          <polygon points="450,25 509,162 638,111 612,215 779,169 672,307 779,386 672,413 792,509 612,505 613,634 509,558 463,690 391,558 268,600 288,505 133,558 228,413 109,344 228,307 132,202 288,215 292,95 391,162"/>
        </svg>
      </div>
      <div class="etiquette"><span class="texte"></span><span class="curseur"></span></div>
      <!-- Tuile, nom et sous-nom se chevauchent exprès (la tuile passe sous le bandeau). -->
      <div class="tuile" data-layout-allow-overlap></div>
      <div class="nom" data-layout-allow-overlap><span></span></div>
      <div class="sous-nom" data-layout-allow-overlap><span></span></div>
      <div class="flash"></div>
    </div>
  </div>
  <script>
    (function () {
      var ID = 'carte-outil';             // à renommer avec le CSS et le HTML
      var S = '#' + ID + ' ';
      // >>> DONNÉES (à remplacer pour chaque outil ; textes d'exemple neutres)
      var DONNEES = {
        etiquette: 'PREMIER',             // le rang, ou le mot qui annonce l'outil (court)
        tailleEtiquette: 130,             // px : 130 pour un mot, 90 pour deux mots
        nom: 'Ton outil',                 // le nom tel qu'il s'écrit
        tailleNom: 130,                   // px : 130 jusqu'à ~11 lettres, 100 au-delà
        sousNom: '',                      // optionnel : version, édition (« V2 Pro »), sinon ''
        logo: null,                       // 'assets/logos/<outil>.svg' (skill thesvg) ; null = initiale
        masque: null,                     // 'assets/images/masque-<id>.png' : silhouette du client
                                          // (outils/masque_etoile.py du kit) ; null = ellipse
        tuile: 'claire',                  // 'claire' (logo coloré ou sombre) | 'sombre' (logo blanc)
        frappe: 0.05                      // s par lettre de l'étiquette
      };
      // <<< DONNÉES
      var root = document.getElementById(ID);
      root.style.setProperty('--taille-etiquette', DONNEES.tailleEtiquette + 'px');
      root.style.setProperty('--taille-nom', DONNEES.tailleNom + 'px');
      var texte = root.querySelector('.etiquette .texte');
      Array.prototype.forEach.call(DONNEES.etiquette, function (c) {
        var l = document.createElement('span'); l.className = 'lettre';
        l.textContent = c; texte.appendChild(l);
      });
      var tuile = root.querySelector('.tuile');
      if (DONNEES.tuile === 'sombre') tuile.classList.add('sombre');
      if (DONNEES.logo) {
        var img = document.createElement('img'); img.src = DONNEES.logo; img.alt = '';
        tuile.appendChild(img);
      } else {
        var ini = document.createElement('span'); ini.className = 'initiale';
        ini.textContent = DONNEES.nom.charAt(0); tuile.appendChild(ini);
      }
      if (DONNEES.masque) {               // silhouette : l'étoile passe vraiment derrière la personne
        var zone = root.querySelector('.etoile-zone');
        var m = 'url("' + DONNEES.masque + '"), linear-gradient(to bottom, black calc(var(--epaules-y) - 24px), transparent var(--epaules-y))';
        zone.style.webkitMaskImage = m; zone.style.maskImage = m;
      }
      root.querySelector('.nom span').textContent = DONNEES.nom;
      root.querySelector('.nom span').setAttribute('data-layout-allow-overlap', '');
      root.querySelector('.sous-nom span').setAttribute('data-layout-allow-overlap', '');
      var sous = root.querySelector('.sous-nom');
      if (DONNEES.sousNom) sous.querySelector('span').textContent = DONNEES.sousNom;
      else sous.style.display = 'none';

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var duree = parseFloat(root.getAttribute('data-duration'));
      // Flash blanc : tout est déjà posé dessous, il s'efface.
      tl.fromTo(S + '.flash', { opacity: 0.92 }, { opacity: 0, duration: 0.4, ease: 'power2.out' }, 0);
      // Étiquette tapée lettre à lettre (déterministe : un set par lettre).
      var n = DONNEES.etiquette.length;
      for (var i = 0; i < n; i++) {
        tl.set(S + '.etiquette .lettre:nth-child(' + (i + 1) + ')', { display: 'inline' }, 0.06 + i * DONNEES.frappe);
      }
      // Curseur : clignote toutes les 0,25 s jusqu'à la fin de la carte.
      for (var t = 0.06 + n * DONNEES.frappe + 0.25, on = false; t < duree; t += 0.25, on = !on) {
        tl.set(S + '.curseur', { opacity: on ? 1 : 0 }, t);
      }
      // Tuile : un petit pop sous le flash (le reste arrive d'un bloc, comme l'original).
      tl.fromTo(S + '.tuile', { scale: 0.9 }, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, 0);
      tl.set(S + '.nom', { opacity: 1 }, duree);
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
