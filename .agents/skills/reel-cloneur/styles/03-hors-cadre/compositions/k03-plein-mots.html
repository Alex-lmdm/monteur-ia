<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°03 « HORS CADRE » · PIÈCE : L'IMAGE PLEIN ÉCRAN À MOTS ÉPARS           ║
    ╠══════════════════════════════════════════════════════════════════════════════╣
    ║ Ce que c'est : une image plein écran assombrie (qui avance très lentement) et ║
    ║ les mots de la phrase en minuscules serif italiques, posés à des places et    ║
    ║ des tailles différentes dans le tiers haut, qui s'empilent mot par mot ; les  ║
    ║ mots forts en doré (l'accent éclairci, avec un halo), les autres en blanc.    ║
    ║ Taille : 1080×1920, OPAQUE (section « full » de tools/sections.py ; le visage ║
    ║ est couvert).                                                                  ║
    ║ Quand : UNE fois par vidéo au plus, juste après l'accroche, 2 à 3 s : la       ║
    ║ phrase qui annonce le sujet. Pas de sous-titres (son id va dans --sans).       ║
    ║                                                                                ║
    ║ À REMPLACER :                                                                  ║
    ║  1. l'id « k03-plein-mots » PARTOUT par l'id de la section ;                   ║
    ║  2. data-duration (racine + .habillage) = durée de la section ;                ║
    ║  3. l'image de fond (emplacement commenté) : une image de la vidéo du client, ║
    ║     ou une capture d'un site public faite par toi (assets/images/ du Reel) ;   ║
    ║     floutée et assombrie par la pièce : une ambiance, jamais une page à lire ; ║
    ║  4. DONNEES.mots : [texte, instant (s), x, y (centre, px), taille (px),        ║
    ║     doré (true/false)] ; rester entre x 100 et 980, y 300 et 900.             ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #k03-plein-mots { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      --k03-titre: var(--brand-font-accent), var(--brand-font-display), serif;
      --k03-clair: oklch(from var(--brand-accent) calc(l + 0.12) c calc(h + 30)); }
    #k03-plein-mots * { box-sizing:border-box; }
    /* Plein écran opaque : le fond est sombre (texte du style), l'image par-dessus. */
    #k03-plein-mots .habillage { position:absolute; inset:0; background: var(--brand-text); }
    #k03-plein-mots .fond { position:absolute; inset:0; width:1080px; height:1920px; object-fit:cover; object-position:50% 0%;
      filter: blur(9px) brightness(0.36) saturate(0.85); }   /* une ambiance, pas une page à lire */
    #k03-plein-mots .fond-exemple { position:absolute; inset:0;
      background: radial-gradient(ellipse at 50% 35%, color-mix(in srgb, var(--brand-surface) 18%, transparent), transparent 70%); }
    #k03-plein-mots .voile { position:absolute; inset:0;
      background: linear-gradient(180deg, color-mix(in srgb, var(--brand-text) 55%, transparent) 0%,
        color-mix(in srgb, var(--brand-text) 15%, transparent) 55%, color-mix(in srgb, var(--brand-text) 60%, transparent) 100%); }
    /* Une ancre de largeur nulle au point (x, y) : le mot s'y centre quelle que soit sa police. */
    #k03-plein-mots .ancre { position:absolute; width:0; display:flex; justify-content:center; }
    #k03-plein-mots .mot { margin:0; white-space:nowrap; flex:none;
      font-family: var(--brand-font-accent); font-style: italic; font-weight: 700; line-height: 1; letter-spacing: -0.5px;
      color: var(--brand-surface); text-shadow: 0 2px 14px color-mix(in srgb, var(--brand-text) 70%, transparent); }
    #k03-plein-mots .mot.dore { color: var(--k03-clair);
      text-shadow: 0 0 18px color-mix(in srgb, var(--k03-clair) 55%, transparent), 0 2px 10px color-mix(in srgb, var(--brand-text) 60%, transparent); }
  </style>
</head>
<body>
  <div id="k03-plein-mots" data-composition-id="k03-plein-mots" data-start="0" data-duration="3"
       data-fps="30" data-width="1080" data-height="1920">
    <div id="k03-plein-mots-calque" class="habillage clip" data-start="0" data-duration="3" data-track-index="0">
      <!-- EMPLACEMENT IMAGE DE FOND : <img class="fond" src="assets/images/<ton-image>.jpg" alt="">
           (une image de la vidéo du client, ou une capture d'un site public faite par toi).
           Exemple neutre ci-dessous, à supprimer. -->
      <div class="fond fond-exemple"></div>
      <div class="voile"></div>
    </div>
  </div>
  <script>
    (function () {
      var ID = 'k03-plein-mots';
      var scope = '#' + ID + ' ';
      // >>> À REMPLACER : [texte, instant (s), x centre, y centre, taille px, doré].
      var DONNEES = {
        mots: [
          ['une méthode', 0.10, 380, 420, 92, false],
          ['simple', 0.45, 790, 420, 110, true],
          ['qui change', 0.95, 330, 560, 60, false],
          ['tout', 1.30, 640, 680, 150, true]
        ]
      };
      var root = document.getElementById(ID);
      var hab = root.querySelector('.habillage');
      DONNEES.mots.forEach(function (m, i) {
        var a = document.createElement('div'); a.className = 'ancre';
        a.style.left = m[2] + 'px'; a.style.top = Math.round(m[3] - m[4] / 2) + 'px';
        var p = document.createElement('p');
        p.className = 'mot w' + i + (m[5] ? ' dore' : '');
        p.textContent = m[0];
        p.style.fontSize = m[4] + 'px';
        a.appendChild(p); hab.appendChild(a);
      });
      var DUREE = parseFloat(root.getAttribute('data-duration'));
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.fromTo(scope + '.fond', { scale: 1.0 }, { scale: 1.06, duration: DUREE, ease: 'none' }, 0);
      DONNEES.mots.forEach(function (m, i) {
        tl.fromTo(scope + '.w' + i, { opacity: 0, scale: 1.1, filter: 'blur(12px)' },
          { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.24, ease: 'power2.out' }, Math.max(0, m[1]));
      });
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
