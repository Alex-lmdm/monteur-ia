<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
  STYLE N°02 · CARTE CRÈME · PIÈCE SIGNATURE : LA CARTE SCHÉMA
  CE QUE C'EST : la carte qui explique l'élément annoncé par la carte titre : comment il marche, en
  tuiles (icônes au trait ou logos réels), légendes courtes et flèches accent. Même plaque que la
  carte titre (x 64 à 1016, y 200 à 740), la carte arrondie la remplit presque toute (22 px de marge) ;
  en-tête accent en petites capitales en haut à gauche, le schéma centré dessous.
  TAILLE : section 1080 x 1920, fond TRANSPARENT, cadrage « decor » dans tools/sections.py.
  QUAND : pendant l'explication de l'élément, de son premier mot à l'élément suivant (3 à 5 s),
  juste après la carte titre du même élément, dans la même section le plus souvent (voir
  carte-titre.html, « deux cartes dans une section »).
  À REMPLACER :
    1. EN-TÊTE : 2 à 4 mots (« Comment ça marche », « Ce que ça change », « Avant / après »).
    2. LE SCHÉMA : 3 colonnes au plus, 4 à 7 éléments en tout, légendes de 1 à 3 mots. Logos réels
       des outils cités (assets/logos/<nom>.svg, skill thesvg), sinon icônes au trait. Modèle livré :
       numéro, tuile, légende par colonne, flèches accent entre les colonnes, une liste cochée à la
       fin. Variantes prêtes (CSS déjà là) en commentaire sous le clip : « pas ça, mais ça »
       (badges) et « comparaison en barres ». Largeur utile : 870 px ; contrôle au snapshot.
    3. Aucun chiffre ni nom que la voix ou le client ne donne : sans chiffre, une barre sans
       valeur ou une autre variante, jamais un chiffre inventé.

  COULEURS ET POLICES : uniquement var(--brand-*), venues du reel.config.json du kit (ou des
  réglages du client s'il garde les siennes). Aucune couleur en dur : n'en ajoute pas.
  RIEN NE BOUGE : pas d'entrée animée, pas de fondu ni de glissé. La carte arrive d'un coup, au mot,
  et la suivante la remplace d'un coup (les clips suffisent, la timeline reste vide).
  CSS : le même bloc dans les trois pièces du kit, scopé sous l'id de la pièce. N'importe quelle
  carte (titre, schéma, variantes) se colle donc dans n'importe quelle section du style.
  RENOMMER pour une section : remplace « carte-schema » partout dans ce fichier (CSS, id, data-composition-id,
  timeline) par l'id de la section dans tools/sections.py, et nomme le fichier compositions/<id>.html.
  DURÉE : data-duration de la racine = durée de la section (python3 tools/sections.py l'affiche) ;
  les clips de cartes se suivent sans trou et finissent avec elle.
  Contrôle : npm run check, puis npx hyperframes snapshot --at <instants> --describe false.
  Fiche du style : style.md, à côté du dossier compositions/ de ce kit.
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    /* ---- Racine : la section entière, 1080 x 1920, fond TRANSPARENT (la vidéo filmée passe dessous). */
    #carte-schema { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      font-family:var(--brand-font-body); color:var(--brand-text); }
    #carte-schema * { box-sizing:border-box; margin:0; }

    /* ---- La plaque : aplat du fond du style, angles droits, en haut (x 64 à 1016, y 200 à 740). */
    #carte-schema .plaque { position:absolute; left:64px; top:200px; width:952px; height:540px;
      background:var(--brand-bg); }
    /* La carte posée dans la plaque : arrondie, bord et ombre très légers. */
    #carte-schema .carte { position:absolute; left:22px; right:22px; border-radius:28px;
      background:var(--brand-surface);
      border:2px solid color-mix(in srgb, var(--brand-text) 7%, transparent);
      box-shadow:0 8px 22px color-mix(in srgb, var(--brand-text) 8%, transparent); }
    #carte-schema .forme-titre { top:64px; bottom:64px; }
    #carte-schema .forme-schema { top:22px; bottom:22px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:72px 36px 28px; }
    /* Éclat : petit ornement facultatif, coin haut droit de la carte. */
    #carte-schema .eclat { position:absolute; top:18px; right:20px; width:30px; height:30px;
      color:var(--brand-muted); opacity:.55; }

    /* ---- Carte titre : étiquette, grand titre condensé, trait, ligne grise, mini-schéma. */
    #carte-schema .etiquette { position:absolute; left:44px; top:28px; right:330px; display:flex;
      align-items:center; gap:14px; color:var(--brand-accent); font-weight:700; font-size:26px;
      letter-spacing:3px; text-transform:uppercase; white-space:nowrap; }
    #carte-schema .losange { width:14px; height:14px; background:var(--brand-accent); transform:rotate(45deg);
      flex:none; }
    #carte-schema .filet { flex:1; height:2px; background:color-mix(in srgb, var(--brand-muted) 35%, transparent); }
    #carte-schema .t { position:absolute; left:44px; top:98px; width:540px; font-family:var(--brand-font-display);
      font-size:116px; line-height:1; color:var(--brand-text); white-space:nowrap; }
    #carte-schema .t.deux { top:86px; line-height:.96; }
    #carte-schema .trait { position:absolute; left:44px; bottom:92px; width:46px; height:4px;
      background:var(--brand-accent); }
    #carte-schema .ligne { position:absolute; left:44px; bottom:30px; width:540px; font-size:28px;
      line-height:1.25; color:var(--brand-muted); white-space:nowrap; }
    /* Mini-schéma : une tuile centrale reliée en pointillés accent à 2 ou 3 petites tuiles. */
    #carte-schema .mini { position:absolute; right:24px; top:50%; width:300px; height:300px; margin-top:-150px; }
    #carte-schema .liens { position:absolute; inset:0; width:300px; height:300px; fill:none;
      stroke:var(--brand-accent); stroke-width:2.5; stroke-dasharray:3 7; stroke-linecap:round; }
    /* Tuiles : un cran plus claires que la carte (--brand-stroke = l'opposé du texte, blanc ici). */
    #carte-schema .sat, #carte-schema .centre, #carte-schema .tuile { display:flex; align-items:center; justify-content:center;
      background:color-mix(in srgb, var(--brand-surface) 55%, var(--brand-stroke));
      border:2px solid color-mix(in srgb, var(--brand-text) 10%, transparent);
      box-shadow:0 4px 12px color-mix(in srgb, var(--brand-text) 7%, transparent); }
    #carte-schema .sat { position:absolute; width:62px; height:62px; border-radius:16px; color:var(--brand-text); }
    #carte-schema .sat > svg, #carte-schema .sat > img { width:36px; height:36px; }
    #carte-schema .centre { position:absolute; left:98px; top:98px; width:104px; height:104px;
      border-radius:24px; color:var(--brand-accent); }
    #carte-schema .centre > svg { width:56px; height:56px; }
    #carte-schema .centre > img { width:62px; height:62px; }

    /* ---- Carte schéma : en-tête, colonnes de tuiles reliées par des flèches accent. */
    #carte-schema .entete { position:absolute; left:40px; top:30px; display:flex; align-items:center; gap:14px;
      color:var(--brand-accent); font-weight:700; font-size:26px; letter-spacing:3px;
      text-transform:uppercase; white-space:nowrap; }
    #carte-schema .rang { display:flex; align-items:center; justify-content:center; gap:18px; }
    /* Étapes : colonnes alignées par le haut (numéros sur une ligne), flèches au milieu. */
    #carte-schema .etapes { align-items:flex-start; }
    #carte-schema .etapes > .fleche { align-self:center; }
    #carte-schema .col { display:flex; flex-direction:column; align-items:center; gap:16px; }
    #carte-schema .num { font-family:var(--brand-font-display); font-size:30px; line-height:1; color:var(--brand-accent); }
    #carte-schema .tuile { position:relative; width:150px; height:150px; border-radius:32px; color:var(--brand-text); }
    #carte-schema .tuile > svg { width:76px; height:76px; }
    #carte-schema .tuile > img { width:90px; height:90px; }
    #carte-schema .tuile.forte { color:var(--brand-accent);
      border-color:color-mix(in srgb, var(--brand-accent) 45%, transparent); }
    #carte-schema .tuile.petite { width:104px; height:104px; border-radius:24px; }
    #carte-schema .tuile.petite > svg { width:52px; height:52px; }
    #carte-schema .tuile.petite > img { width:62px; height:62px; }
    #carte-schema .leg { font-size:30px; font-weight:600; color:var(--brand-text); white-space:nowrap; }
    #carte-schema .leg.doux { font-weight:400; color:var(--brand-muted); }
    #carte-schema .fleche { width:72px; height:32px; color:var(--brand-accent); flex:none; }
    #carte-schema .puce { display:inline-flex; align-items:center; gap:10px; padding:8px 18px; border-radius:999px;
      background:color-mix(in srgb, var(--brand-accent) 14%, transparent); color:var(--brand-text);
      font-size:26px; font-weight:700; white-space:nowrap; }
    #carte-schema .puce > svg { width:28px; height:28px; color:var(--brand-accent); }
    #carte-schema .liste { display:flex; flex-direction:column; gap:20px; }
    #carte-schema .item { display:flex; align-items:center; gap:16px; font-size:32px; font-weight:600; white-space:nowrap; }
    #carte-schema .coche { width:44px; height:44px; border-radius:12px; display:flex; align-items:center;
      justify-content:center; background:var(--brand-accent); color:var(--brand-surface); flex:none; }
    #carte-schema .coche > svg { width:26px; height:26px; stroke-width:2.6; }
    #carte-schema .badge { position:absolute; right:-14px; top:-14px; width:46px; height:46px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; }
    #carte-schema .badge > svg { width:28px; height:28px; stroke-width:2.6; }
    #carte-schema .badge-ok { background:var(--brand-accent); color:var(--brand-surface); }
    #carte-schema .badge-non { background:var(--brand-text); color:var(--brand-surface); }
    /* Variante « comparaison en barres » (chiffres donnés par la voix ou le client, jamais inventés). */
    #carte-schema .compare { width:100%; display:flex; flex-direction:column; gap:40px; }
    #carte-schema .barre { display:grid; grid-template-columns:60px 300px 1fr 150px; align-items:center; gap:20px; }
    #carte-schema .barre > svg, #carte-schema .barre > img { width:56px; height:56px; color:var(--brand-text); }
    #carte-schema .nom { font-size:32px; font-weight:600; white-space:nowrap; }
    #carte-schema .rail { height:30px; border-radius:15px; background:color-mix(in srgb, var(--brand-text) 6%, transparent); }
    #carte-schema .val { height:100%; border-radius:15px; background:color-mix(in srgb, var(--brand-text) 78%, transparent); }
    #carte-schema .val.accent { background:var(--brand-accent); }
    #carte-schema .chiffre { font-family:var(--brand-font-display); font-size:54px; text-align:right; white-space:nowrap; }
    #carte-schema .chiffre.accent { color:var(--brand-accent); }

    /* ---- Carte d'accroche (sans plaque) : bloc du sujet, pastille titre, ligne entre parenthèses. */
    #carte-schema .sujet { position:absolute; left:50%; top:246px; transform:translateX(-50%); height:232px;
      min-width:460px; padding:0 64px; display:flex; align-items:center; justify-content:center; gap:28px;
      background:var(--brand-accent); color:var(--brand-surface);
      font-family:var(--brand-font-display); font-size:104px; line-height:1; white-space:nowrap; }
    #carte-schema .sujet-logo { position:absolute; left:50%; top:246px; transform:translateX(-50%);
      height:232px; width:auto; max-width:820px; }
    #carte-schema .pastille { position:absolute; left:50%; top:515px; transform:translateX(-50%);
      padding:38px 44px 42px; border-radius:24px;
      background:color-mix(in srgb, var(--brand-surface) 55%, var(--brand-stroke));
      font-family:var(--brand-font-display); font-size:56px; line-height:1.05; color:var(--brand-text);
      white-space:nowrap; }
    /* La parenthèse reprend l'allure des sous-titres (classe .cap du style : blanc, ombre douce). */
    #carte-schema .parenthese.cap { top:724px; font-size:46px; font-weight:600; }
  </style>
</head>
<body>
  <div id="carte-schema" data-composition-id="carte-schema" data-start="0" data-duration="3.00000" data-fps="30" data-width="1080" data-height="1920">
      <!-- Carte schéma : de 0 à la fin de la section (ou du mot qui ouvre l'explication, collée après une carte titre). -->
      <div id="carte-schema-carte-0" class="clip" data-start="0.00000" data-duration="3.00000" data-track-index="0" style="position:absolute; inset:0;">
        <div class="plaque"><div class="carte forme-schema">
          <!-- 1. EN-TÊTE -->
          <div class="entete"><span class="losange"></span><span>Comment ça marche</span></div>
          <!-- 2. LE SCHÉMA : colonne 1 -> colonne 2 -> liste cochée -->
          <div class="rang etapes">
            <div class="col"><div class="num">1</div><div class="tuile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg></div><div class="leg">Tes idées</div></div>
            <svg class="fleche" viewBox="0 0 64 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h52M44 4l12 10-12 10"/></svg>
            <div class="col"><div class="num">2</div><div class="tuile forte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div><div class="puce"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5.5 13.5H12L11 21l7.5-10.5H12z"/></svg>Automatique</div></div>
            <svg class="fleche" viewBox="0 0 64 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h52M44 4l12 10-12 10"/></svg>
            <div class="col"><div class="num">3</div><div class="liste">
              <div class="item"><span class="coche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>Les sujets</div>
              <div class="item"><span class="coche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>Les textes</div>
              <div class="item"><span class="coche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>Les dates</div>
            </div></div>
          </div>
          <span class="eclat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.6 4.3 2.7 6.4 7 7-4.3.6-6.4 2.7-7 7-.6-4.3-2.7-6.4-7-7 4.3-.6 6.4-2.7 7-7z"/></svg></span>
        </div></div>
      </div>
      <!-- VARIANTES (à coller à la place du div .rang ci-dessus, dans la même carte) :

        « Pas ça, mais ça » (badges) :
          <div class="rang">
            <div class="col"><div class="tuile">ICÔNE OU LOGO<span class="badge badge-non"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></span></div><div class="leg doux">L'ancienne façon</div></div>
            <svg class="fleche" …>…</svg>
            <div class="col"><div class="tuile forte">ICÔNE OU LOGO<span class="badge badge-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span></div><div class="leg">La bonne</div></div>
          </div>

        « Comparaison en barres » (valeurs dites par la voix ou données par le client ; largeur de
        .val = la valeur ÷ la plus grande, en %) :
          <div class="compare">
            <div class="barre">ICÔNE OU LOGO<div class="nom">Option A</div><div class="rail"><div class="val accent" style="width:20%"></div></div><div class="chiffre accent">VALEUR</div></div>
            <div class="barre">ICÔNE OU LOGO<div class="nom">Option B</div><div class="rail"><div class="val" style="width:100%"></div></div><div class="chiffre">VALEUR</div></div>
          </div>
      -->
  </div>
  <script>
    (function () {
      // Rien ne bouge dans ce style : chaque carte arrive d'un coup et remplace la précédente.
      // Leur visibilité vient des clips (data-start / data-duration), la timeline reste vide.
      window.__timelines = window.__timelines || {};
      window.__timelines["carte-schema"] = gsap.timeline({ paused: true });
    })();
  </script>
</body>
</html>
