<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
  STYLE N°02 · CARTE CRÈME · PIÈCE SIGNATURE : LA CARTE TITRE
  CE QUE C'EST : la carte qui ouvre chaque élément de la liste. Une plaque du fond du style, angles
  droits, posée en haut sur la vidéo filmée (x 64 à 1016, y 200 à 740, 952 x 540 px) ; dedans, une
  carte arrondie : étiquette accent en petites capitales avec un filet, très grand titre condensé,
  petit trait accent, une ligne grise, et à droite un mini-schéma (une tuile centrale reliée en
  pointillés accent à 2 ou 3 petites tuiles).
  TAILLE : section 1080 x 1920, fond TRANSPARENT, cadrage « decor » dans tools/sections.py.
  Sous-titre du style juste dessous (y 800), au-dessus de la tête.
  QUAND : au mot qui annonce l'élément (« le premier », « numéro deux », le nom de l'outil), pour
  2,5 à 3,5 s ; puis la carte schéma du même élément la remplace d'un coup. Une carte titre par
  élément, jamais deux de suite.
  À REMPLACER :
    1. ÉTIQUETTE : un mot et un numéro sur deux chiffres (« Outil 01 », « Étape 02 », « Erreur 03 »),
       20 caractères au plus. Le losange accent et le filet restent.
    2. TITRE : le nom de l'élément, condensé (police display). Taille selon la longueur, pour tenir
       dans 540 px sans toucher le mini-schéma :
         - 11 caractères au plus (espaces compris) : une ligne, 116 px (le réglage livré) ;
         - 12 à 15 : une ligne, font-size = 1290 ÷ nombre de caractères (14 car. : 92px) ;
         - 16 à 26 : deux lignes, class="t deux", <br> à l'espace qui équilibre le mieux,
           font-size = 1290 ÷ caractères de la plus longue ligne, 96 px au plus ;
         - au-delà : raccourcis le titre. Vérifie toujours au snapshot.
    3. LIGNE GRISE : une précision courte (le bénéfice, la source à créditer, le prix si la voix le
       dit), 36 caractères au plus.
    4. MINI-SCHÉMA : la tuile centrale (.centre) porte le logo réel de l'élément s'il en a un
       (<img src="assets/logos/<nom>.svg" alt="">, skill thesvg) ou une icône au trait ; les petites
       tuiles (.sat, 2 ou 3) montrent ce qu'il fait, en icônes ou logos. Une tuile en moins : retire
       son div ET sa <line>. Une en plus : 4e place libre en bas à gauche (left:0px; top:228px ;
       <line x1="31" y1="259" x2="150" y2="150"/>). Ligne = du centre de la petite tuile (x+31,
       y+31) au centre du schéma (150,150).
    5. ÉCLAT (facultatif) : le petit ornement en haut à droite ; retire-le s'il gêne.
  DEUX CARTES DANS UNE SECTION (le cas courant : titre puis schéma de la même idée) : colle le clip
  de la carte schéma (le div .clip de carte-schema.html) sous celui-ci, id="<id>-carte-1",
  data-track-index="1", data-start = l'instant du mot qui ouvre l'explication (relatif à la
  section, sur une image : multiple de 1/30 s), data-duration = le reste de la section, et
  raccourcis data-duration de la carte titre d'autant.

  COULEURS ET POLICES : uniquement var(--brand-*), venues du reel.config.json du kit (ou des
  réglages du client s'il garde les siennes). Aucune couleur en dur : n'en ajoute pas.
  RIEN NE BOUGE : pas d'entrée animée, pas de fondu ni de glissé. La carte arrive d'un coup, au mot,
  et la suivante la remplace d'un coup (les clips suffisent, la timeline reste vide).
  CSS : le même bloc dans les trois pièces du kit, scopé sous l'id de la pièce. N'importe quelle
  carte (titre, schéma, variantes) se colle donc dans n'importe quelle section du style.
  RENOMMER pour une section : remplace « carte-titre » partout dans ce fichier (CSS, id, data-composition-id,
  timeline) par l'id de la section dans tools/sections.py, et nomme le fichier compositions/<id>.html.
  DURÉE : data-duration de la racine = durée de la section (python3 tools/sections.py l'affiche) ;
  les clips de cartes se suivent sans trou et finissent avec elle.
  Contrôle : npm run check, puis npx hyperframes snapshot --at <instants> --describe false.
  Fiche du style : style.md, à côté du dossier compositions/ de ce kit.
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    /* ---- Racine : la section entière, 1080 x 1920, fond TRANSPARENT (la vidéo filmée passe dessous). */
    #carte-titre { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      font-family:var(--brand-font-body); color:var(--brand-text); }
    #carte-titre * { box-sizing:border-box; margin:0; }

    /* ---- La plaque : aplat du fond du style, angles droits, en haut (x 64 à 1016, y 200 à 740). */
    #carte-titre .plaque { position:absolute; left:64px; top:200px; width:952px; height:540px;
      background:var(--brand-bg); }
    /* La carte posée dans la plaque : arrondie, bord et ombre très légers. */
    #carte-titre .carte { position:absolute; left:22px; right:22px; border-radius:28px;
      background:var(--brand-surface);
      border:2px solid color-mix(in srgb, var(--brand-text) 7%, transparent);
      box-shadow:0 8px 22px color-mix(in srgb, var(--brand-text) 8%, transparent); }
    #carte-titre .forme-titre { top:64px; bottom:64px; }
    #carte-titre .forme-schema { top:22px; bottom:22px; display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:72px 36px 28px; }
    /* Éclat : petit ornement facultatif, coin haut droit de la carte. */
    #carte-titre .eclat { position:absolute; top:18px; right:20px; width:30px; height:30px;
      color:var(--brand-muted); opacity:.55; }

    /* ---- Carte titre : étiquette, grand titre condensé, trait, ligne grise, mini-schéma. */
    #carte-titre .etiquette { position:absolute; left:44px; top:28px; right:330px; display:flex;
      align-items:center; gap:14px; color:var(--brand-accent); font-weight:700; font-size:26px;
      letter-spacing:3px; text-transform:uppercase; white-space:nowrap; }
    #carte-titre .losange { width:14px; height:14px; background:var(--brand-accent); transform:rotate(45deg);
      flex:none; }
    #carte-titre .filet { flex:1; height:2px; background:color-mix(in srgb, var(--brand-muted) 35%, transparent); }
    #carte-titre .t { position:absolute; left:44px; top:98px; width:540px; font-family:var(--brand-font-display);
      font-size:116px; line-height:1; color:var(--brand-text); white-space:nowrap; }
    #carte-titre .t.deux { top:86px; line-height:.96; }
    #carte-titre .trait { position:absolute; left:44px; bottom:92px; width:46px; height:4px;
      background:var(--brand-accent); }
    #carte-titre .ligne { position:absolute; left:44px; bottom:30px; width:540px; font-size:28px;
      line-height:1.25; color:var(--brand-muted); white-space:nowrap; }
    /* Mini-schéma : une tuile centrale reliée en pointillés accent à 2 ou 3 petites tuiles. */
    #carte-titre .mini { position:absolute; right:24px; top:50%; width:300px; height:300px; margin-top:-150px; }
    #carte-titre .liens { position:absolute; inset:0; width:300px; height:300px; fill:none;
      stroke:var(--brand-accent); stroke-width:2.5; stroke-dasharray:3 7; stroke-linecap:round; }
    /* Tuiles : un cran plus claires que la carte (--brand-stroke = l'opposé du texte, blanc ici). */
    #carte-titre .sat, #carte-titre .centre, #carte-titre .tuile { display:flex; align-items:center; justify-content:center;
      background:color-mix(in srgb, var(--brand-surface) 55%, var(--brand-stroke));
      border:2px solid color-mix(in srgb, var(--brand-text) 10%, transparent);
      box-shadow:0 4px 12px color-mix(in srgb, var(--brand-text) 7%, transparent); }
    #carte-titre .sat { position:absolute; width:62px; height:62px; border-radius:16px; color:var(--brand-text); }
    #carte-titre .sat > svg, #carte-titre .sat > img { width:36px; height:36px; }
    #carte-titre .centre { position:absolute; left:98px; top:98px; width:104px; height:104px;
      border-radius:24px; color:var(--brand-accent); }
    #carte-titre .centre > svg { width:56px; height:56px; }
    #carte-titre .centre > img { width:62px; height:62px; }

    /* ---- Carte schéma : en-tête, colonnes de tuiles reliées par des flèches accent. */
    #carte-titre .entete { position:absolute; left:40px; top:30px; display:flex; align-items:center; gap:14px;
      color:var(--brand-accent); font-weight:700; font-size:26px; letter-spacing:3px;
      text-transform:uppercase; white-space:nowrap; }
    #carte-titre .rang { display:flex; align-items:center; justify-content:center; gap:18px; }
    /* Étapes : colonnes alignées par le haut (numéros sur une ligne), flèches au milieu. */
    #carte-titre .etapes { align-items:flex-start; }
    #carte-titre .etapes > .fleche { align-self:center; }
    #carte-titre .col { display:flex; flex-direction:column; align-items:center; gap:16px; }
    #carte-titre .num { font-family:var(--brand-font-display); font-size:30px; line-height:1; color:var(--brand-accent); }
    #carte-titre .tuile { position:relative; width:150px; height:150px; border-radius:32px; color:var(--brand-text); }
    #carte-titre .tuile > svg { width:76px; height:76px; }
    #carte-titre .tuile > img { width:90px; height:90px; }
    #carte-titre .tuile.forte { color:var(--brand-accent);
      border-color:color-mix(in srgb, var(--brand-accent) 45%, transparent); }
    #carte-titre .tuile.petite { width:104px; height:104px; border-radius:24px; }
    #carte-titre .tuile.petite > svg { width:52px; height:52px; }
    #carte-titre .tuile.petite > img { width:62px; height:62px; }
    #carte-titre .leg { font-size:30px; font-weight:600; color:var(--brand-text); white-space:nowrap; }
    #carte-titre .leg.doux { font-weight:400; color:var(--brand-muted); }
    #carte-titre .fleche { width:72px; height:32px; color:var(--brand-accent); flex:none; }
    #carte-titre .puce { display:inline-flex; align-items:center; gap:10px; padding:8px 18px; border-radius:999px;
      background:color-mix(in srgb, var(--brand-accent) 14%, transparent); color:var(--brand-text);
      font-size:26px; font-weight:700; white-space:nowrap; }
    #carte-titre .puce > svg { width:28px; height:28px; color:var(--brand-accent); }
    #carte-titre .liste { display:flex; flex-direction:column; gap:20px; }
    #carte-titre .item { display:flex; align-items:center; gap:16px; font-size:32px; font-weight:600; white-space:nowrap; }
    #carte-titre .coche { width:44px; height:44px; border-radius:12px; display:flex; align-items:center;
      justify-content:center; background:var(--brand-accent); color:var(--brand-surface); flex:none; }
    #carte-titre .coche > svg { width:26px; height:26px; stroke-width:2.6; }
    #carte-titre .badge { position:absolute; right:-14px; top:-14px; width:46px; height:46px; border-radius:50%;
      display:flex; align-items:center; justify-content:center; }
    #carte-titre .badge > svg { width:28px; height:28px; stroke-width:2.6; }
    #carte-titre .badge-ok { background:var(--brand-accent); color:var(--brand-surface); }
    #carte-titre .badge-non { background:var(--brand-text); color:var(--brand-surface); }
    /* Variante « comparaison en barres » (chiffres donnés par la voix ou le client, jamais inventés). */
    #carte-titre .compare { width:100%; display:flex; flex-direction:column; gap:40px; }
    #carte-titre .barre { display:grid; grid-template-columns:60px 300px 1fr 150px; align-items:center; gap:20px; }
    #carte-titre .barre > svg, #carte-titre .barre > img { width:56px; height:56px; color:var(--brand-text); }
    #carte-titre .nom { font-size:32px; font-weight:600; white-space:nowrap; }
    #carte-titre .rail { height:30px; border-radius:15px; background:color-mix(in srgb, var(--brand-text) 6%, transparent); }
    #carte-titre .val { height:100%; border-radius:15px; background:color-mix(in srgb, var(--brand-text) 78%, transparent); }
    #carte-titre .val.accent { background:var(--brand-accent); }
    #carte-titre .chiffre { font-family:var(--brand-font-display); font-size:54px; text-align:right; white-space:nowrap; }
    #carte-titre .chiffre.accent { color:var(--brand-accent); }

    /* ---- Carte d'accroche (sans plaque) : bloc du sujet, pastille titre, ligne entre parenthèses. */
    #carte-titre .sujet { position:absolute; left:50%; top:246px; transform:translateX(-50%); height:232px;
      min-width:460px; padding:0 64px; display:flex; align-items:center; justify-content:center; gap:28px;
      background:var(--brand-accent); color:var(--brand-surface);
      font-family:var(--brand-font-display); font-size:104px; line-height:1; white-space:nowrap; }
    #carte-titre .sujet-logo { position:absolute; left:50%; top:246px; transform:translateX(-50%);
      height:232px; width:auto; max-width:820px; }
    #carte-titre .pastille { position:absolute; left:50%; top:515px; transform:translateX(-50%);
      padding:38px 44px 42px; border-radius:24px;
      background:color-mix(in srgb, var(--brand-surface) 55%, var(--brand-stroke));
      font-family:var(--brand-font-display); font-size:56px; line-height:1.05; color:var(--brand-text);
      white-space:nowrap; }
    /* La parenthèse reprend l'allure des sous-titres (classe .cap du style : blanc, ombre douce). */
    #carte-titre .parenthese.cap { top:724px; font-size:46px; font-weight:600; }
  </style>
</head>
<body>
  <div id="carte-titre" data-composition-id="carte-titre" data-start="0" data-duration="3.00000" data-fps="30" data-width="1080" data-height="1920">
      <!-- Carte titre : de 0 au mot qui ouvre l'explication (relatif à la section). -->
      <div id="carte-titre-carte-0" class="clip" data-start="0.00000" data-duration="3.00000" data-track-index="0" style="position:absolute; inset:0;">
        <div class="plaque"><div class="carte forme-titre">
          <!-- 1. ÉTIQUETTE -->
          <div class="etiquette"><span class="losange"></span><span>Outil 01</span><span class="filet"></span></div>
          <!-- 2. TITRE (taille : voir la règle en tête) -->
          <div class="t">Le planning</div>
          <div class="trait"></div>
          <!-- 3. LIGNE GRISE -->
          <div class="ligne">Toute ta semaine, prévue d'avance</div>
          <!-- 4. MINI-SCHÉMA : tuile centrale + 3 petites tuiles (icônes au trait ou logos réels) -->
          <div class="mini"><svg class="liens" viewBox="0 0 300 300"><line x1="31" y1="41" x2="150" y2="150"/><line x1="269" y1="41" x2="150" y2="150"/><line x1="269" y1="259" x2="150" y2="150"/></svg>
            <div class="sat" style="left:0px; top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg></div>
            <div class="sat" style="left:238px; top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 8.5 6h1L14 18M5.6 14h6.8"/><path d="M15.5 11.5c.7-.9 1.6-1.3 2.6-1.3 1.6 0 2.4.9 2.4 2.5V18M20.5 14.2c-3.6 0-5.3.8-5.3 2.2 0 1 .8 1.7 2 1.7 1.6 0 3.3-1.2 3.3-3"/></svg></div>
            <div class="sat" style="left:238px; top:228px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4.5v8.2l-1.6-1.6a1.4 1.4 0 0 0-2 2l3.9 4.4c.9 1 2.2 1.6 3.5 1.6h1.4a4.3 4.3 0 0 0 4.3-4.3v-3.6a1.3 1.3 0 0 0-2.6 0v-.6a1.3 1.3 0 0 0-2.6 0v-.5a1.3 1.3 0 0 0-2.6 0V4.5a1.3 1.3 0 0 0-2.6 0z"/></svg></div>
            <div class="centre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div>
          </div>
          <!-- 5. ÉCLAT (facultatif) -->
          <span class="eclat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c.6 4.3 2.7 6.4 7 7-4.3.6-6.4 2.7-7 7-.6-4.3-2.7-6.4-7-7 4.3-.6 6.4-2.7 7-7z"/></svg></span>
        </div></div>
      </div>
  </div>
  <script>
    (function () {
      // Rien ne bouge dans ce style : chaque carte arrive d'un coup et remplace la précédente.
      // Leur visibilité vient des clips (data-start / data-duration), la timeline reste vide.
      window.__timelines = window.__timelines || {};
      window.__timelines["carte-titre"] = gsap.timeline({ paused: true });
    })();
  </script>
</body>
</html>
