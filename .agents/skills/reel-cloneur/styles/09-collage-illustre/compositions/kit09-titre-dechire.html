<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    KIT N°09 « COLLAGE ILLUSTRÉ » · PIÈCE : TITRE SUR PAPIER DÉCHIRÉ (section DECOR, 1080x1920,
    fond transparent, posée sur la vidéo filmée ; 3 s d'exemple)
    Ce que c'est : une grande feuille de papier sombre au bord bas déchiré descend du haut (0,32 s) et
    couvre le haut de l'image jusqu'à 770 px (40 %) ; le titre en trois lignes arrive : petites lignes en
    machine à écrire dont les lettres volent et se posent, mot-clé à empattements blanc sur bandeau ocre
    qui se déroule ; un trait de craie commente la tête ; à la fin (2,68 s → 2,98 s) la feuille tombe et
    couvre tout l'écran : la section suivante (collage) commence sur cette feuille.
    Quand : UNE fois par vidéo, l'accroche (0,5 à 1 s après le début, 1,5 à 3 s). La vidéo dessous est
    recadrée pour que le haut de la tête tombe à 40 % (montage.decorTransform, voir style.md).
    À remplacer : les trois lignes du titre ; le trait de craie ; la chute de la feuille = 0,3 s avant la
    fin de la section (le tl.to sur .feuille).
    Couleurs : var(--brand-*) seulement (fond = --brand-bg, 2e papier = --brand-surface, papier
    chaud = mélange fond + accent, blanc des bandes et des étiquettes = --brand-text, encre = --brand-bg,
    bandeau et traits forts = --brand-accent, impression passée = --brand-muted) : le reel.config.json du
    kit les règle. Polices : Inter (réglages), « Courier Prime » (machine à écrire, --brand-font-accent) et « Abril
    Fatface » (mot-clé, --brand-font-display), livrées avec Monteur IA (licences OFL
    jointes) ; sans elles, repli sur var(--brand-font-mono) / var(--brand-font-display).
    Temps : en secondes depuis le début de la section, à caler sur les mots
    (derush/<vidéo>_words.json) ; data-duration du calque et de la racine = durée de la section.
    Tout est déterministe : formes déchirées précalculées, aucun hasard au rendu.
    Renommer la pièce = renommer l'id PARTOUT (racine, data-composition-id, calque, filtres
    #<id>-craie/-grain/-taches, constante ID du script), et garder un id différent de toute classe.
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #kit09-titre-dechire { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; background:transparent;
      --kit-machine: var(--brand-font-accent), var(--brand-font-mono); --kit-titre: var(--brand-font-display), var(--brand-font-display);
      --kit-blanc: var(--brand-text); --kit-encre: var(--brand-bg);
      --kit-ombre: color-mix(in srgb, var(--brand-stroke) 55%, transparent); }
    #kit09-titre-dechire * { box-sizing:border-box; margin:0; padding:0; }
    #kit09-titre-dechire .calque { position:absolute; inset:0; }
    /* Papier : teinte (--p) + trame de points + plis ; le grain et les taches viennent de .grain. */
    #kit09-titre-dechire .papier { position:absolute; inset:0; background:var(--p); }
    #kit09-titre-dechire .trame { position:absolute; inset:0; opacity:.55;
      background-image: radial-gradient(color-mix(in srgb, var(--brand-text) 11%, transparent) 1.4px, transparent 2px);
      background-size: 9px 9px;
      -webkit-mask-image: radial-gradient(ellipse 60% 40% at 18% 22%, var(--brand-text) 0%, transparent 70%), radial-gradient(ellipse 55% 35% at 85% 78%, var(--brand-text) 0%, transparent 70%);
      mask-image: radial-gradient(ellipse 60% 40% at 18% 22%, var(--brand-text) 0%, transparent 70%), radial-gradient(ellipse 55% 35% at 85% 78%, var(--brand-text) 0%, transparent 70%); }
    #kit09-titre-dechire .pli-v { position:absolute; top:0; bottom:0; left:102px; width:7px;

    #kit09-titre-dechire .et-papier img { width:64%; height:64%; object-fit:contain; }

    #kit09-titre-dechire .bande { position:absolute; display:flex; white-space:nowrap; font-family:var(--brand-font-accent); font-weight:400;
      color:var(--kit-encre); line-height:1; filter: drop-shadow(0 8px 10px var(--kit-ombre)); }
    #kit09-titre-dechire .bande i { font-style:normal; background:var(--kit-blanc); padding:.16em 0 .12em; }
    #kit09-titre-dechire .bande i:first-child { padding-left:.32em; }
    #kit09-titre-dechire .bande i:last-child { padding-right:.32em; }
    /* Lettres découpées (lettre de rançon) : une lettre = un bout de papier. */
    #kit09-titre-dechire .rancon { position:absolute; display:flex; align-items:center; gap:.08em; font-family:var(--brand-font-accent);
      color:var(--kit-encre); line-height:1; filter: drop-shadow(0 8px 10px var(--kit-ombre)); }
    #kit09-titre-dechire .rancon b { display:block; font-weight:400; background:var(--kit-blanc); padding:.1em .14em .08em; }
    #kit09-titre-dechire .rancon b.gras { font-weight:700; }
    #kit09-titre-dechire .rancon b.esp { width:.4em; background:none; padding:0; }
    /* Craie : trait tracé à la main, grain de craie par le filtre. */
    #kit09-titre-dechire .craie { position:absolute; overflow:visible; fill:none; stroke-linecap:round; stroke-linejoin:round; filter:url(#kit09-titre-dechire-craie); }
    #kit09-titre-dechire .craie path { stroke-dasharray:1; stroke-dashoffset:1; }
    #kit09-titre-dechire .encre-text { stroke:var(--brand-text); }
    #kit09-titre-dechire .encre-accent { stroke:var(--brand-accent); }
    #kit09-titre-dechire .titre { position:absolute; left:150px; top:214px; display:flex; flex-direction:column; align-items:flex-start; gap:30px; }
    #kit09-titre-dechire .titre-machine { display:flex; font-family:var(--brand-font-accent); font-weight:700; letter-spacing:.40em;
      color:var(--brand-text); line-height:1; filter:url(#kit09-titre-dechire-craie); }
    #kit09-titre-dechire .titre-l1 { font-size:62px; margin-left:46px; }
    #kit09-titre-dechire .titre-l3 { font-size:58px; align-self:flex-end; margin-right:-26px; }
    #kit09-titre-dechire .titre-machine i, #kit09-titre-dechire .titre-cle i { font-style:normal; display:inline-block; position:relative; }
    #kit09-titre-dechire .titre-cle { position:relative; display:flex; align-items:center; height:172px; padding:0 32px;
      font-family:var(--brand-font-display); font-size:132px; letter-spacing:.02em; color:var(--brand-text); line-height:1; }
    #kit09-titre-dechire .titre-bandeau { position:absolute; inset:0; background:var(--brand-accent); transform-origin:0 50%; }
    #kit09-titre-dechire .titre-bandeau::after { content:""; position:absolute; inset:0; opacity:.35;

    #kit09-titre-dechire .feuille { position:absolute; left:0; top:0; width:1080px; height:2004px; }
