<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE 06 · PLONGÉE ÉCRAN · pièce « écran d'ordinateur »                       ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
    CE QUE C'EST : un ordinateur portable en gros plan sur le fond du style (dégradé de
      var(--brand-bg)). L'écran déborde à gauche et à droite, le bas du portable tombe juste
      au-dessus des sous-titres (y = 1500). Dans l'écran, la caméra zoome et glisse comme un
      enregistrement d'écran : du plan entier vers la zone utile (menu, champ, résultat), par
      coupes sèches ou mouvements de 0,35 s. Curseur avec halo, saisie lettre à lettre,
      apparitions, passage d'une page à l'autre « en fouet » (la page fuit sur le côté, floue).
    TAILLE : 1080 x 1920, section `full` de tools/sections.py (le visage est couvert).
    QUAND : à chaque étape montrée d'un outil, d'un site ou d'une appli ; une page ou un zoom par
      idée, un changement toutes les 0,7 à 1,2 s. Plusieurs sections de suite peuvent l'utiliser.
    À REMPLACER :
      1. L'id `ecran-ordinateur` PARTOUT (CSS, HTML, data-composition-id, constante ID du script)
         par l'id de la section ; data-duration (racine et .scene) = durée de la section.
      2. Les PAGES (div.page, 1600 x 1000 px chacune) : une capture d'écran
         <img src="assets/images/ta-capture.png" alt=""> (16:10, 1600 x 1000 ou plus, source
         notée), ou une interface dessinée (classes .appli, .champ, .fil, .bulle-moi, .reponse,
         .grille, .panneau). Les textes d'exemple (« Ton outil », « Par quoi on commence ? »…)
         se remplacent par ceux de l'outil montré. Emplacement LOGO : div.logo-vide.
      3. Les RÉGLAGES du script : PLANS (t en s depuis le début de la section, page à montrer,
         s = zoom >= 1, x / y = point de la page à centrer, cadre 'serre' ou 'large', entree
         'coupe' | 'zoom' | 'fouet', vers = glissé lent jusqu'au plan suivant), CURSEUR, SAISIES
         (sélecteur d'un span.saisie avec data-texte, t0 / t1), APPARITIONS ('pop', 'fondu',
         'cache'). Instants calés sur les mots de derush/<vidéo>_words.json.
    Couleurs et polices : var(--brand-*) uniquement (reel.config.json du style).
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>

    #ecran-ordinateur { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; font-family:var(--brand-font-body); }
    #ecran-ordinateur * { box-sizing:border-box; }
    #ecran-ordinateur .scene { position:absolute; inset:0; overflow:hidden;
      background:linear-gradient(162deg, color-mix(in srgb, var(--brand-bg) 62%, var(--brand-text)) 0%,
        var(--brand-bg) 46%, color-mix(in srgb, var(--brand-bg) 72%, var(--brand-text)) 100%); }
    #ecran-ordinateur .reflet { position:absolute; left:-300px; top:-200px; width:1700px; height:900px; border-radius:50%;
      background:color-mix(in srgb, var(--brand-text) 16%, transparent); filter:blur(120px); }
    #ecran-ordinateur .camera { position:absolute; left:0; top:0; width:1720px; height:1150px; transform-origin:0 0; }
    #ecran-ordinateur .couvercle { position:absolute; left:0; top:0; width:1720px; height:1100px; border-radius:46px 46px 12px 12px;
      background:var(--brand-surface);
      box-shadow:inset 0 0 0 4px color-mix(in srgb, var(--brand-surface) 72%, var(--brand-text)); }
    #ecran-ordinateur .webcam { position:absolute; left:851px; top:16px; width:18px; height:18px; border-radius:50%;
      background:var(--brand-muted); box-shadow:0 0 0 4px color-mix(in srgb, var(--brand-surface) 80%, var(--brand-text)); }
    #ecran-ordinateur .ecran { position:absolute; left:60px; top:50px; width:1600px; height:1000px; overflow:hidden; border-radius:6px;
      background:var(--brand-text); }
    #ecran-ordinateur .contenu { position:absolute; inset:0; }
    #ecran-ordinateur .zoom { position:absolute; left:0; top:0; width:1600px; height:1000px; transform-origin:0 0; }
    #ecran-ordinateur .halo { opacity:0; }
    #ecran-ordinateur .page { position:absolute; inset:0; opacity:0; }
    #ecran-ordinateur .page > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #ecran-ordinateur .socle { position:absolute; left:-110px; top:1094px; width:1940px; height:56px; border-radius:6px 6px 60px 60px / 6px 6px 40px 40px;
      background:linear-gradient(180deg, color-mix(in srgb, var(--brand-surface) 70%, var(--brand-text)) 0%, var(--brand-surface) 60%); }
    #ecran-ordinateur .encoche { position:absolute; left:760px; top:1094px; width:200px; height:16px; border-radius:0 0 14px 14px;
      background:color-mix(in srgb, var(--brand-surface) 85%, var(--brand-muted)); }
    /* Curseur : flèche + halo (accent) ; il se déplace en x/y, jamais en left/top. */
    #ecran-ordinateur .curseur { position:absolute; left:0; top:0; width:56px; height:56px; opacity:0; }
    #ecran-ordinateur .curseur svg { position:absolute; left:0; top:0; width:56px; height:56px; }
    #ecran-ordinateur .halo { position:absolute; left:-34px; top:-34px; width:68px; height:68px; border-radius:50%;
      background:color-mix(in srgb, var(--brand-accent) 38%, transparent); }

    #ecran-ordinateur .appli { position:absolute; inset:0; display:flex; background:var(--brand-text);
      color:var(--brand-surface); font-family:var(--brand-font-body); }
    #ecran-ordinateur .laterale { width:330px; height:100%; padding:34px 22px; display:flex; flex-direction:column; gap:10px;
      background:color-mix(in srgb, var(--brand-text) 93%, var(--brand-surface)); }
    #ecran-ordinateur .laterale .logo-appli { width:52px; height:52px; margin:0 0 26px 14px; }
    #ecran-ordinateur .laterale .item { font-size:30px; font-weight:600; padding:16px 18px; border-radius:16px; }
    #ecran-ordinateur .laterale .item.actif { background:color-mix(in srgb, var(--brand-text) 80%, var(--brand-surface)); }
    #ecran-ordinateur .principal { position:relative; flex:1; height:100%; }
    #ecran-ordinateur .entete { position:absolute; left:44px; top:34px; font-size:34px; font-weight:700; }
    #ecran-ordinateur .accroche-appli { position:absolute; left:0; right:0; top:330px; text-align:center; font-size:56px; font-weight:600;
      letter-spacing:-0.5px; }
    #ecran-ordinateur .champ { position:absolute; left:110px; right:110px; top:450px; height:118px; border-radius:60px;
      border:3px solid color-mix(in srgb, var(--brand-text) 80%, var(--brand-surface));
      box-shadow:0 10px 30px color-mix(in srgb, var(--brand-surface) 14%, transparent);
      display:flex; align-items:center; padding:0 40px; font-size:38px; font-weight:400; background:var(--brand-text); }
    #ecran-ordinateur .champ.bas { top:auto; bottom:44px; }
    #ecran-ordinateur .champ .plus { font-size:52px; font-weight:400; margin-right:26px; opacity:.7; }
    #ecran-ordinateur .zone { position:relative; flex:1; min-width:0; align-self:stretch; display:flex; align-items:center;
      white-space:nowrap; overflow:hidden; }
    #ecran-ordinateur .champ.multi { height:auto; min-height:118px; padding:30px 40px; align-items:flex-start; }
    #ecran-ordinateur .champ.multi .zone { white-space:normal; line-height:1.3; min-height:50px; display:block; }
    #ecran-ordinateur .champ.multi .placeholder { top:0; transform:none; }
    #ecran-ordinateur .champ.multi .saisie { white-space:normal; }
    #ecran-ordinateur .points { font-size:44px; letter-spacing:6px; color:color-mix(in srgb, var(--brand-surface) 55%, var(--brand-text)); }
    #ecran-ordinateur .placeholder { position:absolute; left:0; top:50%; transform:translateY(-50%); white-space:nowrap;
      color:color-mix(in srgb, var(--brand-surface) 50%, var(--brand-text)); }
    #ecran-ordinateur .saisie { white-space:nowrap; }
    #ecran-ordinateur .champ .envoyer { margin-left:auto; width:66px; height:66px; border-radius:50%; flex:none;
      background:var(--brand-surface); }
    #ecran-ordinateur .fil { position:absolute; left:70px; right:240px; top:120px; bottom:190px; display:flex; flex-direction:column; gap:30px; }
    #ecran-ordinateur .bulle-moi { align-self:flex-end; max-width:960px; padding:24px 34px; border-radius:36px; font-size:32px; line-height:1.3;
      background:color-mix(in srgb, var(--brand-text) 90%, var(--brand-surface)); }
    #ecran-ordinateur .reponse { display:flex; gap:22px; align-items:flex-start; }
    #ecran-ordinateur .reponse .logo-appli { width:50px; height:50px; flex:none; margin-top:4px; }
    #ecran-ordinateur .reponse .texte { font-size:32px; line-height:1.35; }
    #ecran-ordinateur .grille { display:grid; gap:16px; margin-top:20px; }
    #ecran-ordinateur .grille img { width:100%; height:100%; object-fit:cover; border-radius:16px; display:block; }
    #ecran-ordinateur .grille .case { position:relative; border-radius:18px; }
    #ecran-ordinateur .grille .case .anneau { position:absolute; inset:-9px; border-radius:24px; border:7px solid var(--brand-accent); opacity:0; }
    #ecran-ordinateur .voile { position:absolute; inset:0; background:color-mix(in srgb, var(--brand-surface) 45%, transparent); }
    #ecran-ordinateur .panneau { position:absolute; left:185px; top:120px; width:900px; height:760px; border-radius:30px; padding:44px;
      background:var(--brand-text); box-shadow:0 30px 80px color-mix(in srgb, var(--brand-surface) 40%, transparent); }
    #ecran-ordinateur .panneau .titre { font-size:44px; font-weight:700; margin-bottom:30px; }
    #ecran-ordinateur .recherche { height:96px; border-radius:24px; display:flex; align-items:center; padding:0 30px; font-size:36px;
      background:color-mix(in srgb, var(--brand-text) 93%, var(--brand-surface)); }
    #ecran-ordinateur .recherche .loupe { width:40px; height:40px; margin-right:22px; border:5px solid var(--brand-surface); border-radius:50%; opacity:.6; flex:none; }
    #ecran-ordinateur .resultat-ligne { margin-top:44px; display:flex; align-items:center; gap:28px; padding:26px; border-radius:24px;
      border:3px solid color-mix(in srgb, var(--brand-text) 85%, var(--brand-surface)); }
    #ecran-ordinateur .resultat-ligne .vignette { width:110px; height:110px; border-radius:26px; flex:none; object-fit:cover; }
    #ecran-ordinateur .resultat-ligne .nom { font-size:38px; font-weight:700; }
    #ecran-ordinateur .resultat-ligne .desc { font-size:28px; margin-top:6px; color:color-mix(in srgb, var(--brand-surface) 70%, var(--brand-text)); }
    #ecran-ordinateur .bouton { position:relative; margin-left:auto; height:76px; padding:0 34px; border-radius:40px; display:flex; align-items:center;
      font-size:30px; font-weight:700; color:var(--brand-text); background:var(--brand-surface); white-space:nowrap; }
    #ecran-ordinateur .bouton .apres { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; border-radius:40px;
      background:var(--brand-accent); color:var(--brand-text); opacity:0; }


    /* Emplacements vides : à remplacer par tes images (voir l'en-tête). */
    #ecran-ordinateur .vide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
      font-family:var(--brand-font-body); font-weight:700; font-size:40px; line-height:1.3; padding:40px;
      color:var(--brand-text); background:color-mix(in srgb, var(--brand-surface) 85%, var(--brand-bg));
      border:4px dashed color-mix(in srgb, var(--brand-text) 55%, transparent); }
    #ecran-ordinateur .tuile { position:relative; aspect-ratio:1 / 1; border-radius:18px; overflow:hidden; }
    #ecran-ordinateur .tuile .vide { font-size:34px; }
    #ecran-ordinateur .logo-vide { width:52px; height:52px; border-radius:14px; margin:0 0 26px 14px; background:var(--brand-surface); }
    #ecran-ordinateur .marque .logo-vide { width:150px; height:150px; border-radius:34px; margin:0; background:var(--brand-text);
      border:6px dashed var(--brand-surface); }
  </style>
</head>
<body>
  <div id="ecran-ordinateur" data-composition-id="ecran-ordinateur" data-start="0" data-duration="5.0" data-fps="30" data-width="1080" data-height="1920">
    <div id="ecran-ordinateur-scene" class="scene clip" data-start="0" data-duration="5.0" data-track-index="0">
      <div class="reflet" data-layout-allow-overflow></div>
      <div class="camera" data-layout-allow-overflow>
        <div class="couvercle"><div class="webcam"></div>
          <div class="ecran"><div class="contenu"><div class="zoom">
              <div class="page p-1"><div class="appli"><div class="laterale"><div class="logo-vide"></div><div class="item item-0">Accueil</div><div class="item item-1">Recherche</div><div class="item item-2">Modules</div><div class="item item-3">Projets</div></div><div class="principal"><div class="entete">Ton outil</div><div class="accroche-appli">Par quoi on commence ?</div><div class="champ"><span class="plus">+</span><span class="zone"><span class="placeholder ph-saisie-1">Pose ta question</span><span class="saisie saisie-1" data-texte="Écris ta demande ici"></span></span><span class="envoyer"></span></div></div></div></div>
              <div class="page p-2"><div class="vide">Ta capture d&#x27;écran ici (1600 x 1000)</div></div>
              <div class="curseur"><div class="halo"></div><svg viewBox="0 0 56 56" aria-hidden="true"><path d="M8 4 L8 46 L19 35 L27 52 L35 48 L27 32 L43 32 Z" fill="var(--brand-surface)" stroke="var(--brand-text)" stroke-width="3" stroke-linejoin="round"/></svg></div>
          </div></div></div>
        </div>
        <div class="socle"></div><div class="encoche"></div>
      </div>
    </div>
  </div>
  <script>

  (function () {
    var ID = 'ecran-ordinateur';
    var S = '#' + ID + ' ';
    var root = document.getElementById(ID);
    // ===== RÉGLAGES DE LA SECTION (à remplacer) =====
    var DUREE = 5.0;
    var PLANS = [{"t": 0, "page": "p-1", "s": 1, "x": 850, "y": 500, "vers": {"s": 1.05, "x": 860, "y": 480}}, {"t": 1.2, "entree": "zoom", "s": 1.8, "x": 250, "y": 300}, {"t": 2.0, "entree": "zoom", "s": 1.45, "x": 900, "y": 510}, {"t": 3.4, "entree": "fouet", "page": "p-2", "s": 1, "x": 800, "y": 500}, {"t": 4.2, "entree": "zoom", "s": 1.5, "x": 800, "y": 400, "vers": {"s": 1.58, "x": 800, "y": 400}}];
    var CURSEUR = [{"t": 0.8, "x": 700, "y": 700}, {"t": 1.5, "x": 120, "y": 302, "clic": true}, {"t": 3.0, "x": 1300, "y": 510, "clic": true, "cache": false}];
    var SAISIES = [{"sel": ".saisie-1", "t0": 2.3, "t1": 3.0, "placeholder": ".ph-saisie-1"}];
    var APPARITIONS = [];
    // ===== FIN DES RÉGLAGES =====
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    // Saisies : chaque lettre devient un <span class="c">, révélé lettre à lettre (sans callback,
    // donc juste dans l'aperçu comme au rendu).
    SAISIES.forEach(function (s) {
      var el = root.querySelector(s.sel);
      if (!el) { return; }
      var txt = el.getAttribute('data-texte') || '';
      el.textContent = '';
      for (var i = 0; i < txt.length; i++) {
        var c = document.createElement('span'); c.className = 'c'; c.textContent = txt[i]; el.appendChild(c);
      }
      gsap.set(S + s.sel + ' .c', { opacity: 0 });
      if (s.placeholder) { tl.set(S + s.placeholder, { opacity: 0 }, s.t0); }
      tl.to(S + s.sel + ' .c', { opacity: 1, duration: 0.01, stagger: (s.t1 - s.t0) / Math.max(1, txt.length) }, s.t0);
    });

    // Deux caméras. CADRE : le portable lui-même, 'serre' (l'écran déborde à gauche et à droite,
    // le bas du portable juste au-dessus des sous-titres) ou 'large' (le portable entier).
    // ZOOM : dans l'écran, le point (x, y) de la page (1600 x 1000) vient au centre de la partie
    // visible de l'écran, grossi s fois (s >= 1), comme un enregistrement d'écran qui zoome.
    // `vers` : où le zoom glisse doucement jusqu'au plan suivant. `entree` : 'coupe' (saut sec,
    // par défaut), 'zoom' (mouvement de 0,35 s), 'fouet' (la page fuit sur le côté, floue).
    var CADRES = { serre: { x: -347.5, y: 332.4, scale: 1.032 }, large: { x: 24, y: 600, scale: 0.6 } };
    var VX0 = 276, VX1 = 1324;   // partie de l'écran visible dans l'image, en cadre serré
    function zoom(p) {
      var s = Math.max(1, p.s || 1);
      var tx = Math.min(VX0, Math.max(VX1 - 1600 * s, 800 - s * p.x));
      var ty = Math.min(0, Math.max(1000 - 1000 * s, 500 - s * p.y));
      return { x: tx, y: ty, scale: s };
    }
    PLANS.forEach(function (p, i) {
      var fin = i + 1 < PLANS.length ? PLANS[i + 1].t : DUREE;
      var z = zoom(p), c = CADRES[p.cadre || 'serre'];
      var anime = p.entree === 'zoom' && i > 0;
      if (p.entree === 'fouet' && i === 0) {
        tl.fromTo(S + '.contenu', { x: 520, filter: 'blur(26px)' }, { x: 0, filter: 'blur(0px)', duration: 0.16, ease: 'power3.out' }, 0);
      }
      if (p.entree === 'fouet' && i > 0) {
        tl.to(S + '.contenu', { x: -520, filter: 'blur(26px)', duration: 0.11, ease: 'power2.in' }, p.t - 0.11);
        tl.fromTo(S + '.contenu', { x: 520, filter: 'blur(26px)' }, { x: 0, filter: 'blur(0px)', duration: 0.16, ease: 'power3.out', immediateRender: false }, p.t);
      }
      if (p.t <= 0) {
        gsap.set(S + '.zoom', z); gsap.set(S + '.camera', c);   // états de départ hors timeline
      } else if (anime) {
        tl.to(S + '.zoom', { x: z.x, y: z.y, scale: z.scale, duration: 0.35, ease: 'power3.inOut' }, p.t);
        tl.to(S + '.camera', { x: c.x, y: c.y, scale: c.scale, duration: 0.35, ease: 'power3.inOut' }, p.t);
      } else {
        tl.set(S + '.zoom', z, p.t); tl.set(S + '.camera', c, p.t);
      }
      if (p.page && p.t <= 0) {
        gsap.set(S + '.' + p.page, { opacity: 1 });
      } else if (p.page) {
        tl.set(S + '.page', { opacity: 0 }, p.t);
        tl.set(S + '.' + p.page, { opacity: 1 }, p.t);
      }
      if (p.vers) {
        var v = zoom(p.vers), t0 = p.t + (anime ? 0.35 : 0);
        tl.to(S + '.zoom', { x: v.x, y: v.y, scale: v.scale, duration: Math.max(0.1, fin - t0), ease: 'none' }, t0);
      }
    });
    CURSEUR.forEach(function (c, i) {
      if (i === 0) {
        gsap.set(S + '.curseur', { x: c.x, y: c.y, opacity: 0 });
        tl.to(S + '.curseur', { opacity: 1, duration: 0.15 }, c.t);
      } else {
        tl.to(S + '.curseur', { x: c.x, y: c.y, duration: 0.4, ease: 'power2.inOut' }, c.t - 0.4);
      }
      if (c.clic) { tl.fromTo(S + '.halo', { scale: 0.5, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.45, ease: 'power2.out', immediateRender: false }, c.t); }
      if (c.cache) { tl.to(S + '.curseur', { opacity: 0, duration: 0.12 }, c.t); }
    });
    APPARITIONS.forEach(function (a) {
      if (a.effet === 'cache') { tl.set(S + a.sel, { opacity: 0 }, a.t); return; }
      gsap.set(S + a.sel, { opacity: 0 });
      if (a.effet === 'pop') { tl.fromTo(S + a.sel, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: 'back.out(1.6)', immediateRender: false }, a.t); }
      else { tl.fromTo(S + a.sel, { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, a.t); }
    });

    window.__timelines[ID] = tl;
  })();

  </script>
</body>
</html>
