<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE N°07 « TITRE EXPLOSIF » · PIÈCE 3 : LA FENÊTRE DE DÉMONSTRATION          ║
    ╠══════════════════════════════════════════════════════════════════════════════╣
    ║ Ce que c'est : une fenêtre d'appli dessinée (barre à trois points, titre au    ║
    ║ centre, état en couleur d'accent à droite) qui MIME ce que fait l'outil,       ║
    ║ étape par étape, au rythme de la voix : une phase, puis une autre (fondu       ║
    ║ court dans la fenêtre), les lignes s'allumant une à une avec un point          ║
    ║ d'accent. Ce n'est jamais une vraie capture : un dessin simplifié.             ║
    ║ Les tuiles d'outils déjà nommés restent épinglées au-dessus de la tête.        ║
    ║ Taille : section plein cadre 1080×1920, fond TRANSPARENT, format « decor ».    ║
    ║ Fenêtre 680×520, x=200, haut à y=1165 (sous le sous-titre, posé à y=1115),     ║
    ║ sur le buste. Apparaît en fondu (0,5 s), disparaît en fondu (0,4 s).           ║
    ║ Quand l'utiliser : la partie « comment ça marche » (une fois par vidéo, 6 à    ║
    ║ 13 s). Pour deux idées côte à côte, prends la pièce fenetres-empilees.         ║
    ║                                                                                ║
    ║ À REMPLACER :                                                                  ║
    ║  1. L'id « fenetre-demo » (id et data-composition-id de la racine, constante   ║
    ║     ID du script) par l'id de la section ; data-duration (racine, panneau).    ║
    ║  2. Les tuiles : comme dans tuiles-outils (data-apparait="-1" si déjà nommé).  ║
    ║  3. .fenetre : data-apparait / data-disparait (s, depuis le début de la        ║
    ║     section) ; titre (.titre) ; états (.etat, data-de = instant d'affichage).  ║
    ║  4. Les phases (.phase, data-de) et leur contenu. Tout élément porteur de      ║
    ║     data-mot s'allume à cet instant : le mot DIT dans derush/<vidéo>_words.json║
    ║     moins le début de la section. Textes : ce que la voix dit, rien d'inventé  ║
    ║     (aucun chiffre que la vidéo ne donne pas).                                 ║
    ║  5. EMPLACEMENTS DE LOGO (.puce) : <img src="assets/logos/<outil>.svg"> (vrai  ║
    ║     logo, skill thesvg) ; sans logo, l'initiale dans .initiale.                ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #fenetre-demo { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden;
      background:transparent; --k07-tuile-top:300px; }
    #fenetre-demo * { box-sizing:border-box; }
    #fenetre-demo .panneau { position:absolute; inset:0; background:transparent; }
    /* --- Tuiles (mêmes règles que la pièce tuiles-outils) --- */
    #fenetre-demo .tuile { position:absolute; top:var(--k07-tuile-top); width:210px; height:210px;
      border-radius:30px; background:var(--brand-text); display:flex; align-items:center; justify-content:center;
      box-shadow: 7px 8px 0 color-mix(in srgb, var(--brand-bg) 82%, transparent),
                  0 14px 30px color-mix(in srgb, var(--brand-bg) 35%, transparent); }
    #fenetre-demo .tuile.gauche { left:190px; }
    #fenetre-demo .tuile.droite { left:675px; }
    #fenetre-demo .tuile img { width:146px; height:146px; object-fit:contain; display:block; }
    #fenetre-demo .tuile .nom { font-family:var(--brand-font-body); font-weight:900; font-size:56px;
      letter-spacing:-1.5px; color:var(--brand-bg); line-height:1; }
    /* --- Fenêtre d'appli dessinée --- */
    #fenetre-demo .fenetre { position:absolute; left:200px; top:1165px; width:680px; height:520px;
      border-radius:24px; overflow:hidden; opacity:0; font-family:var(--brand-font-body); color:var(--brand-bg);
      background:color-mix(in srgb, var(--brand-text) 96%, var(--brand-bg));
      box-shadow:0 22px 60px color-mix(in srgb, var(--brand-bg) 45%, transparent); }
    #fenetre-demo .barre { position:relative; height:56px; display:flex; align-items:center; padding:0 22px;
      background:var(--brand-text); border-bottom:2px solid color-mix(in srgb, var(--brand-text) 90%, var(--brand-bg)); }
    #fenetre-demo .barre i { width:15px; height:15px; border-radius:50%; margin-right:9px;
      background:color-mix(in srgb, var(--brand-muted) 70%, var(--brand-text)); }
    #fenetre-demo .titre { position:absolute; left:0; right:0; text-align:center; font-size:25px; font-weight:700; }
    #fenetre-demo .etat { position:absolute; right:22px; font-size:19px; font-weight:700; font-style:normal; opacity:0;
      color:color-mix(in srgb, var(--brand-accent) 78%, var(--brand-bg)); }
    #fenetre-demo .phase { position:absolute; left:0; right:0; top:56px; bottom:0; padding:22px 26px; opacity:0; }
    #fenetre-demo .entete { display:flex; align-items:center; gap:12px; font-size:22px; font-weight:700; }
    #fenetre-demo .entete .rond { width:34px; height:34px; border-radius:50%;
      background:linear-gradient(160deg, color-mix(in srgb, var(--brand-accent) 55%, var(--brand-text)), var(--brand-accent)); }
    #fenetre-demo .entete small { font-size:17px; font-weight:400; color:color-mix(in srgb, var(--brand-muted) 62%, var(--brand-bg)); }
    #fenetre-demo .bulle { margin-top:18px; padding:18px 22px; border-radius:18px; font-size:27px; line-height:1.35;
      background:color-mix(in srgb, var(--brand-text) 88%, var(--brand-bg)); }
    #fenetre-demo .bulle span { opacity:0; }
    #fenetre-demo .puces { display:flex; gap:14px; margin-top:20px; }
    #fenetre-demo .puce { flex:1; display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:16px;
      background:var(--brand-text); border:2px solid color-mix(in srgb, var(--brand-text) 86%, var(--brand-bg));
      font-size:23px; font-weight:700; white-space:nowrap; }
    #fenetre-demo .puce img { width:40px; height:40px; object-fit:contain; }
    #fenetre-demo .puce .initiale { width:40px; height:40px; border-radius:10px; display:flex; align-items:center;
      justify-content:center; background:var(--brand-bg); color:var(--brand-text); font-size:22px; font-weight:900; }
    #fenetre-demo .message { margin-top:16px; font-size:27px; }
    /* Écran sombre stylisé (dessin, pas une capture) + ligne de lecture qui le balaie. */
    #fenetre-demo .ecran { position:relative; margin-top:14px; height:196px; border-radius:14px; overflow:hidden;
      background:var(--brand-bg); }
    #fenetre-demo .ecran .bloc { position:absolute; border-radius:6px; }
    #fenetre-demo .ecran .b1 { left:22px; top:18px; width:270px; height:16px; background:var(--brand-accent); }
    #fenetre-demo .ecran .b2 { left:330px; top:14px; width:248px; height:92px; border-radius:8px;
      background:color-mix(in srgb, var(--brand-surface) 35%, var(--brand-text)); border-top:14px solid var(--brand-surface); }
    #fenetre-demo .ecran .b3 { left:22px; top:120px; width:230px; height:14px;
      background:color-mix(in srgb, var(--brand-accent) 55%, var(--brand-muted)); }
    #fenetre-demo .ecran .l { position:absolute; height:6px; border-radius:3px;
      background:color-mix(in srgb, var(--brand-muted) 55%, var(--brand-bg)); }
    #fenetre-demo .ecran .scan { position:absolute; left:0; right:0; top:0; height:4px; background:var(--brand-accent);
      box-shadow:0 0 18px var(--brand-accent); opacity:.9; }
    #fenetre-demo .liste { margin-top:16px; }
    #fenetre-demo .liste div { display:flex; align-items:center; gap:12px; font-size:23px; line-height:1.6; opacity:0; }
    #fenetre-demo .liste b { font-weight:700; }
    #fenetre-demo .liste em { font-style:normal; color:color-mix(in srgb, var(--brand-muted) 62%, var(--brand-bg)); }
    #fenetre-demo .liste .point { width:14px; height:14px; border-radius:50%; background:var(--brand-accent); flex:none; }
  </style>
</head>
<body>
  <div id="fenetre-demo" data-composition-id="fenetre-demo" data-start="0"
       data-duration="10" data-fps="30" data-width="1080" data-height="1920">
    <div id="fenetre-demo-panneau" class="panneau clip" data-start="0" data-duration="10" data-track-index="0">

      <!-- Tuiles déjà nommées (data-apparait="-1" = visibles dès la 1re image). EMPLACEMENT DU LOGO :
           <img src="assets/logos/<outil>.svg" alt="<Outil>"> à la place du <span class="nom">. -->
      <div class="tuile gauche" data-apparait="-1"><span class="nom">Outil</span></div>
      <div class="tuile droite" data-apparait="-1"><span class="nom">Appli</span></div>

      <div class="fenetre" data-apparait="0.5" data-disparait="9.5">
        <div class="barre"><i></i><i></i><i></i>
          <b class="titre">Assistant</b>
          <!-- États : un seul visible à la fois, chacun à partir de data-de. -->
          <em class="etat" data-de="0">En attente</em>
          <em class="etat" data-de="5">En cours</em>
        </div>

        <!-- PHASE 1 (exemple) : on choisit un outil, puis on lui écrit la demande, mot à mot. -->
        <div class="phase" data-de="0">
          <div class="entete"><span class="rond"></span>Ton assistant <small>maintenant</small></div>
          <div class="puces">
            <!-- EMPLACEMENT DE LOGO : <img src="assets/logos/<outil>.svg" alt=""> à la place de .initiale -->
            <div class="puce" data-mot="1.0"><span class="initiale">A</span>Outil A</div>
            <div class="puce" data-mot="1.4"><span class="initiale">B</span>Outil B</div>
            <div class="puce" data-mot="1.8"><span class="initiale">C</span>Outil C</div>
          </div>
          <div class="bulle" data-mot="2.3"><span data-mot="2.4">Résume</span> <span data-mot="2.7">ce</span> <span data-mot="2.85">document</span> <span data-mot="3.3">en</span> <span data-mot="3.45">trois</span> <span data-mot="3.7">points.</span></div>
        </div>

        <!-- PHASE 2 (exemple) : l'outil travaille ; chaque ligne s'allume quand la voix la dit. -->
        <div class="phase" data-de="5">
          <div class="entete"><span class="rond"></span>Ton assistant <small>maintenant</small></div>
          <div class="message">Lecture en cours…</div>
          <div class="ecran">
            <div class="bloc b1"></div><div class="bloc b2"></div><div class="bloc b3"></div>
            <div class="l" style="left:22px; top:48px; width:250px"></div>
            <div class="l" style="left:22px; top:64px; width:200px"></div>
            <div class="l" style="left:22px; top:150px; width:220px"></div>
            <div class="l" style="left:330px; top:130px; width:200px"></div>
            <div class="l" style="left:330px; top:146px; width:150px"></div>
            <div class="scan"></div>
          </div>
          <div class="liste">
            <div data-mot="5.6"><span class="point"></span><b>Étape 1</b><em>· faite</em></div>
            <div data-mot="6.6"><span class="point"></span><b>Étape 2</b><em>· faite</em></div>
            <div data-mot="7.6"><span class="point"></span><b>Étape 3</b><em>· en cours</em></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var ID = 'fenetre-demo'; // = id de la section (tools/sections.py)
      var scope = '#' + ID + ' ';
      var root = document.getElementById(ID);
      // Durée de la section : au rendu, la racine peut perdre son data-duration (il passe à l'hôte du master) :
      // on la lit sur le panneau, sinon sur la racine ou son hôte.
      var DUREE = parseFloat((root.querySelector('.panneau') || root).getAttribute('data-duration'));
      if (isNaN(DUREE)) { var hote = root.closest('[data-duration]'); DUREE = hote ? parseFloat(hote.getAttribute('data-duration')) : 0; }
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      function num(el, attr, def) { var v = parseFloat(el.getAttribute(attr)); return isNaN(v) ? def : v; }
      // Tuiles
      root.querySelectorAll('.tuile').forEach(function (el, i) {
        var cls = 't' + i; el.classList.add(cls);
        var t = num(el, 'data-apparait', -1);
        if (t < 0) { tl.set(scope + '.' + cls, { opacity: 1, scale: 1 }, 0); return; }
        tl.set(scope + '.' + cls, { opacity: 0 }, 0);
        tl.fromTo(scope + '.' + cls, { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.32, ease: 'back.out(2.2)' }, t);
      });
      // Fenêtre : fondu d'entrée (0,5 s) avec un très léger agrandissement, fondu de sortie (0,4 s).
      var f = root.querySelector('.fenetre');
      var fin = Math.min(num(f, 'data-disparait', DUREE), DUREE);
      tl.fromTo(scope + '.fenetre', { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'power2.out' }, num(f, 'data-apparait', 0));
      if (fin < DUREE) tl.to(scope + '.fenetre', { opacity: 0, duration: 0.4, ease: 'power2.in' }, fin);
      // États : un seul visible à la fois.
      var etats = root.querySelectorAll('.etat');
      etats.forEach(function (el, i) {
        var cls = 'e' + i; el.classList.add(cls);
        tl.set(scope + '.' + cls, { opacity: 1 }, num(el, 'data-de', 0));
        if (i + 1 < etats.length) tl.set(scope + '.' + cls, { opacity: 0 }, num(etats[i + 1], 'data-de', DUREE));
      });
      // Phases : fondu court de l'une à l'autre (0,25 s).
      var phases = root.querySelectorAll('.phase');
      phases.forEach(function (el, i) {
        var cls = 'p' + i; el.classList.add(cls);
        var de = num(el, 'data-de', 0);
        if (i === 0) tl.set(scope + '.' + cls, { opacity: 1 }, 0);
        else tl.fromTo(scope + '.' + cls, { opacity: 0 }, { opacity: 1, duration: 0.25 }, de);
        if (i + 1 < phases.length) tl.to(scope + '.' + cls, { opacity: 0, duration: 0.25 }, num(phases[i + 1], 'data-de', DUREE));
      });
      // Éléments qui s'allument quand la voix les dit.
      root.querySelectorAll('[data-mot]').forEach(function (el, i) {
        var cls = 'w' + i; el.classList.add(cls);
        tl.fromTo(scope + '.' + cls, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.22, ease: 'expo.out' }, num(el, 'data-mot', 0));
      });
      // Ligne de lecture : balaie l'écran sombre en boucle tant que la phase est là (déterministe).
      root.querySelectorAll('.scan').forEach(function (el, i) {
        var cls = 's' + i; el.classList.add(cls);
        var ph = el.closest('.phase'); var de = num(ph, 'data-de', 0);
        var n = Math.max(1, Math.floor((fin - de) / 1.6));
        tl.fromTo(scope + '.' + cls, { y: 0 }, { y: 192, duration: 1.6, ease: 'none', repeat: n - 1 }, de);
      });
      window.__timelines[ID] = tl;
    })();
  </script>
</body>
</html>
