<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════════╗
    ║ STYLE 06 · DÉMO SUR ORDINATEUR · pièce « carte de fin »                       ║
    ╚══════════════════════════════════════════════════════════════════════════════╝
    CE QUE C'EST : sur le fond bleu du style, l'ordinateur portable entier entre par la droite
      avec sa traînée, puis le logo et le nom de l'outil présenté apparaissent au-dessus.
    TAILLE : 1080 x 1920, section `full`. Portable en y 760 à 1400 : les sous-titres (y = 1500)
      passent dessous.
    QUAND : la dernière phrase (le nom de l'outil, l'appel à l'action), 2,5 à 4 s.
    À REMPLACER :
      1. L'id `carte-fin` PARTOUT par l'id de la section ; data-duration.
      2. L'écran (.ecran, 860 x 538 px) : <img src="assets/images/ta-capture.png" alt="">.
      3. Emplacement LOGO (.logo-vide) : <img class="logo" src="assets/logos/…" alt=""> (skill
         thesvg, ou logo du client) ; sans logo, le nom seul. Le nom : texte de .nom.
      4. ENTREE (durée de l'entrée du portable) et MARQUE (instant d'apparition du logo, sur le mot).
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>

    #carte-fin { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; font-family:var(--brand-font-body); }
    #carte-fin * { box-sizing:border-box; }
    #carte-fin .scene { position:absolute; inset:0; overflow:hidden;
      background:linear-gradient(162deg, color-mix(in srgb, var(--brand-bg) 62%, var(--brand-text)) 0%,
        var(--brand-bg) 46%, color-mix(in srgb, var(--brand-bg) 72%, var(--brand-text)) 100%); }
    #carte-fin .reflet { position:absolute; left:-300px; top:-200px; width:1700px; height:900px; border-radius:50%;
      background:color-mix(in srgb, var(--brand-text) 16%, transparent); filter:blur(120px); }
    #carte-fin .marque { position:absolute; left:100px; right:100px; top:400px; height:190px; display:flex; align-items:center;
      justify-content:center; gap:34px; opacity:0; }
    #carte-fin .marque .logo { height:150px; width:150px; border-radius:34px; object-fit:cover; }
    #carte-fin .marque .nom { font-size:104px; font-weight:700; letter-spacing:-2px; color:var(--brand-text); white-space:nowrap; }
    #carte-fin .portable { position:absolute; left:60px; top:760px; width:960px; height:640px; }
    #carte-fin .portable.echo { opacity:0; }
    #carte-fin .couvercle { position:absolute; left:20px; top:0; width:920px; height:590px; border-radius:26px 26px 8px 8px;
      background:var(--brand-surface); box-shadow:inset 0 0 0 3px color-mix(in srgb, var(--brand-surface) 72%, var(--brand-text)); }
    #carte-fin .webcam { position:absolute; left:455px; top:9px; width:10px; height:10px; border-radius:50%; background:var(--brand-muted); }
    #carte-fin .ecran { position:absolute; left:30px; top:26px; width:860px; height:538px; overflow:hidden; border-radius:4px;
      background:var(--brand-text); }
    #carte-fin .ecran > img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #carte-fin .socle { position:absolute; left:-20px; top:586px; width:1000px; height:34px; border-radius:4px 4px 40px 40px / 4px 4px 26px 26px;
      background:linear-gradient(180deg, color-mix(in srgb, var(--brand-surface) 70%, var(--brand-text)) 0%, var(--brand-surface) 60%); }


    /* Emplacements vides : à remplacer par tes images (voir l'en-tête). */
    #carte-fin .vide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center;
      font-family:var(--brand-font-body); font-weight:700; font-size:40px; line-height:1.3; padding:40px;
      color:var(--brand-text); background:color-mix(in srgb, var(--brand-surface) 85%, var(--brand-bg));
      border:4px dashed color-mix(in srgb, var(--brand-text) 55%, transparent); }
    #carte-fin .tuile { position:relative; aspect-ratio:1 / 1; border-radius:18px; overflow:hidden; }
    #carte-fin .tuile .vide { font-size:34px; }
    #carte-fin .logo-vide { width:52px; height:52px; border-radius:14px; margin:0 0 26px 14px; background:var(--brand-surface); }
    #carte-fin .marque .logo-vide { width:150px; height:150px; border-radius:34px; margin:0; background:var(--brand-text);
      border:6px dashed var(--brand-surface); }
  </style>
</head>
<body>
  <div id="carte-fin" data-composition-id="carte-fin" data-start="0" data-duration="3.5" data-fps="30" data-width="1080" data-height="1920">
    <div id="carte-fin-scene" class="scene clip" data-start="0" data-duration="3.5" data-track-index="0">
      <div class="reflet" data-layout-allow-overflow></div>
      <div class="marque"><div class="logo-vide"></div><span class="nom">Ton outil</span></div>
      <div class="portable" data-layout-allow-overflow data-layout-allow-overlap><div class="couvercle"><div class="webcam"></div><div class="ecran"><div class="vide">Ta capture ici</div></div></div><div class="socle"></div></div>
    </div>
  </div>
  <script>

  (function () {
    var ID = 'carte-fin';
    var S = '#' + ID + ' ';
    var root = document.getElementById(ID);
    // ===== RÉGLAGES DE LA SECTION (à remplacer) =====
    var DUREE = 3.5;
    var ENTREE = 0.32;
    var MARQUE = 1.0;
    var SAISIES = [];
    // ===== FIN DES RÉGLAGES =====
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    // Saisies : chaque lettre devient un <span class="c">, révélé lettre à lettre (sans callback,
    // donc juste dans l'aperçu comme au rendu).
    SAISIES.forEach(function (s) {
      var el = root.querySelector(s.sel);
      if (!el) { return; }
      var txt = el.getAttribute('data-texte') || '';
      el.textContent = '';
      for (var i = 0; i < txt.length; i++) {
        var c = document.createElement('span'); c.className = 'c'; c.textContent = txt[i]; el.appendChild(c);
      }
      gsap.set(S + s.sel + ' .c', { opacity: 0 });
      if (s.placeholder) { tl.set(S + s.placeholder, { opacity: 0 }, s.t0); }
      tl.to(S + s.sel + ' .c', { opacity: 1, duration: 0.01, stagger: (s.t1 - s.t0) / Math.max(1, txt.length) }, s.t0);
    });

    // Le portable entre par la droite avec sa traînée, puis le logo et le nom apparaissent au-dessus.
    var ECHOS = [0.4, 0.22, 0.1];
    var base = root.querySelector('.portable');
    for (var k = 0; k < ECHOS.length; k++) {
      var e = base.cloneNode(true); e.classList.add('echo'); e.classList.add('echo-' + k); base.parentNode.insertBefore(e, base);
    }
    tl.fromTo(S + '.portable:not(.echo)', { x: 1300, filter: 'blur(18px)' }, { x: 0, filter: 'blur(0px)', duration: ENTREE, ease: 'power3.out' }, 0);
    ECHOS.forEach(function (o, k) {
      tl.fromTo(S + '.echo-' + k, { x: 1300, opacity: o }, { x: 0, duration: ENTREE, ease: 'power3.out', immediateRender: false }, 0.035 * (k + 1));
      tl.to(S + '.echo-' + k, { opacity: 0, duration: 0.06 }, ENTREE + 0.035 * (k + 1) - 0.06);
    });
    tl.fromTo(S + '.marque', { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.15, ease: 'expo.out' }, MARQUE);

    window.__timelines[ID] = tl;
  })();

  </script>
</body>
</html>
