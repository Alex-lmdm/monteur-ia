<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <!--
    KIT N°09 « COLLAGE » · PIÈCE : TRAITS DE CRAIE (calque 1080x1920, fond transparent, 5 s)
    Ce que c'est : les dessins à la main du style, tracés en 0,15 à 0,4 s (stroke-dashoffset) : éclat et
    cercle (mettre en valeur), flèche, croix ocre (barrer, épaisse, sur fond blanc aussi), double flèche
    (échanger), curseur (cliquer), ondes (un son), boucle (qui revient), traits ocre (mouvement, un
    élément qui arrive), souligné.
    Quand : 1 à 2 traits par scène au plus, sur le mot qu'ils commentent ; craie blanche sur le papier,
    ocre (--brand-accent) quand le trait passe sur du blanc ou doit crier.
    À remplacer : la forme (CRAIE), la place, la taille, le moment ; une nouvelle forme = un chemin SVG
    de plus (viewBox à soi, pathLength="1").
    Couleurs : var(--brand-*) seulement (fond = --brand-bg, 2e papier = --brand-surface, papier
    chaud = mélange fond + accent, blanc des bandes et des étiquettes = --brand-text, encre = --brand-bg,
    bandeau et traits forts = --brand-accent, impression passée = --brand-muted) : le reel.config.json du
    kit les règle. Polices : Inter (réglages), « Courier Prime » (machine à écrire, --brand-font-accent) et « Abril
    Fatface » (mot-clé, --brand-font-display), livrées avec Monteur IA (licences OFL
    jointes) ; sans elles, repli sur var(--brand-font-mono) / var(--brand-font-display).
    Temps : en secondes depuis le début de la section, à caler sur les mots
    (derush/<vidéo>_words.json) ; data-duration du calque et de la racine = durée de la section.
    Tout est déterministe : formes déchirées précalculées, aucun hasard au rendu.
    Renommer la pièce = renommer l'id PARTOUT (racine, data-composition-id, calque, filtres
    #<id>-craie/-grain/-taches, constante ID du script), et garder un id différent de toute classe.
  -->
  <script src="assets/vendor/gsap.min.js"></script>
  <link rel="stylesheet" href="brand/fonts.css">
  <link rel="stylesheet" href="brand/tokens.css">
  <style>
    #kit09-traits-craie { position:absolute; inset:0; width:1080px; height:1920px; overflow:hidden; background:transparent;
      --kit-machine: var(--brand-font-accent), var(--brand-font-mono); --kit-titre: var(--brand-font-display), var(--brand-font-display);
      --kit-blanc: var(--brand-text); --kit-encre: var(--brand-bg);
      --kit-ombre: color-mix(in srgb, var(--brand-stroke) 55%, transparent); }
    #kit09-traits-craie * { box-sizing:border-box; margin:0; padding:0; }
    #kit09-traits-craie .calque { position:absolute; inset:0; }
    /* Papier : teinte (--p) + trame de points + plis ; le grain et les taches viennent de .grain. */
    #kit09-traits-craie .papier { position:absolute; inset:0; background:var(--p); }
    #kit09-traits-craie .trame { position:absolute; inset:0; opacity:.55;
      background-image: radial-gradient(color-mix(in srgb, var(--brand-text) 11%, transparent) 1.4px, transparent 2px);
      background-size: 9px 9px;
      -webkit-mask-image: radial-gradient(ellipse 60% 40% at 18% 22%, var(--brand-text) 0%, transparent 70%), radial-gradient(ellipse 55% 35% at 85% 78%, var(--brand-text) 0%, transparent 70%);
      mask-image: radial-gradient(ellipse 60% 40% at 18% 22%, var(--brand-text) 0%, transparent 70%), radial-gradient(ellipse 55% 35% at 85% 78%, var(--brand-text) 0%, transparent 70%); }
    #kit09-traits-craie .pli-v { position:absolute; top:0; bottom:0; left:102px; width:7px;

    #kit09-traits-craie .pli-h { position:absolute; left:0; right:0; top:1300px; height:6px; rotate:-.35deg;

    #kit09-traits-craie .imp-m { scale:-1 1; }
    #kit09-traits-craie .grain { position:absolute; inset:0; width:1080px; height:1920px; pointer-events:none; }
    #kit09-traits-craie .grain .taches { fill:var(--brand-text); opacity:.045; }
    #kit09-traits-craie .grain .poussiere { fill:var(--brand-text); opacity:.55; }
    #kit09-traits-craie .vignette { position:absolute; inset:0; background: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 55%, color-mix(in srgb, var(--brand-stroke) 50%, transparent) 100%); }
    #kit09-traits-craie .scene { position:absolute; inset:0; }
    /* Découpes : photo détourée, ombre portée de papier collé. */
    #kit09-traits-craie .decoupe { position:absolute; }
    #kit09-traits-craie .dc-ombre { filter: drop-shadow(0 20px 22px var(--kit-ombre)); }
    #kit09-traits-craie .dc-boite { overflow:hidden; }
    #kit09-traits-craie .decoupe img { display:block; width:100%; height:auto; }
    /* Étiquettes : logo sur un carré de papier blanc déchiré. */
    #kit09-traits-craie .etiquette { position:absolute; }
    #kit09-traits-craie .et-ombre { position:absolute; inset:0; filter: drop-shadow(0 14px 16px var(--kit-ombre)); }
    #kit09-traits-craie .et-papier { position:absolute; inset:0; background:var(--kit-blanc); display:flex; align-items:center; justify-content:center; }
    #kit09-traits-craie .et-papier img { width:64%; height:64%; object-fit:contain; }
    /* Mot machine à écrire : chaque lettre porte son bout de bande blanche (la bande s'allonge). */
    #kit09-traits-craie .bande { position:absolute; display:flex; white-space:nowrap; font-family:var(--brand-font-accent); font-weight:400;
      color:var(--kit-encre); line-height:1; filter: drop-shadow(0 8px 10px var(--kit-ombre)); }
    #kit09-traits-craie .bande i { font-style:normal; background:var(--kit-blanc); padding:.16em 0 .12em; }
    #kit09-traits-craie .bande i:first-child { padding-left:.32em; }
    #kit09-traits-craie .bande i:last-child { padding-right:.32em; }
    /* Lettres découpées (lettre de rançon) : une lettre = un bout de papier. */
    #kit09-traits-craie .rancon { position:absolute; display:flex; align-items:center; gap:.08em; font-family:var(--brand-font-accent);
      color:var(--kit-encre); line-height:1; filter: drop-shadow(0 8px 10px var(--kit-ombre)); }
    #kit09-traits-craie .rancon b { display:block; font-weight:400; background:var(--kit-blanc); padding:.1em .14em .08em; }
    #kit09-traits-craie .rancon b.gras { font-weight:700; }
    #kit09-traits-craie .rancon b.esp { width:.4em; background:none; padding:0; }
    /* Craie : trait tracé à la main, grain de craie par le filtre. */
    #kit09-traits-craie .craie { position:absolute; overflow:visible; fill:none; stroke-linecap:round; stroke-linejoin:round; filter:url(#kit09-traits-craie-craie); }
    #kit09-traits-craie .craie path { stroke-dasharray:1; stroke-dashoffset:1; }
    #kit09-traits-craie .encre-text { stroke:var(--brand-text); }
    #kit09-traits-craie .encre-accent { stroke:var(--brand-accent); }

  </style>
